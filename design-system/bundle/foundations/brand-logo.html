<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:0;background:var(--sh-page-bg);font-family:'Heebo',system-ui,sans-serif}
  .full{background:#0B1B3E;display:flex;align-items:center;justify-content:center;padding:22px}
  .full img{max-width:100%;height:auto;border-radius:12px}
  .note{padding:14px 20px;font-size:12px;color:var(--sh-text-tip);text-align:center}
  .dm{position:fixed;bottom:8px;left:8px;width:28px;height:28px;border-radius:8px;border:1px solid rgba(51,81,202,0.18);background:rgba(255,255,255,0.82);cursor:pointer;font-size:14px;line-height:1;padding:0}
</style>
</head>
<body>
  <div class="full"><img src="../assets/og-image.png" alt="WaffleStack logo lockup"></div>
  <div class="note">מנעל הלוגו הרשמי — מונח על נייבי כהה (#0B1B3E). וורדמארק בעברית ובאנגלית + תגית "סטטיסטיקה כמשחק".</div>
  <button class="dm" aria-label="Toggle dark mode" onclick="document.documentElement.classList.toggle('dark')">◐</button>
</body></html>
