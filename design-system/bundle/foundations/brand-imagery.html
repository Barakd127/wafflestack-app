<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--sh-page-bg);font-family:'Inter',system-ui,sans-serif}
  .row{display:flex;gap:12px}
  .img{flex:1;height:170px;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(31,62,108,0.18)}
  .img img{width:100%;height:100%;object-fit:cover}
  .dm{position:fixed;bottom:8px;left:8px;width:28px;height:28px;border-radius:8px;border:1px solid rgba(51,81,202,0.18);background:rgba(255,255,255,0.82);cursor:pointer;font-size:14px;line-height:1;padding:0}
</style>
</head>
<body>
  <div class="row">
    <div class="img"><img src="../assets/city-render-1.png" alt="isometric knowledge city"></div>
    <div class="img"><img src="../assets/city-render-2.jpg" alt="knowledge diorama render"></div>
  </div>
  <button class="dm" aria-label="Toggle dark mode" onclick="document.documentElement.classList.toggle('dark')">◐</button>
</body></html>
