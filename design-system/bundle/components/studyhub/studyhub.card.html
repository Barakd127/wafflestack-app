<!-- @dsCard group="Components" viewport="1180x640" name="StudyHub shell parts" subtitle="Sidebar + TopBar shell with course, topic and quiz-intro cards" -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  /* card-local layout only */
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }
  .card-shell {
    width: 1180px; height: 640px;
    display: flex; flex-direction: row; /* RTL: first child = right side */
    background: var(--sh-page-bg);
    overflow: hidden;
  }
  .card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .card-content { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  .card-row-cards { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 16px; align-items: start; }
  .card-row-quiz { display: flex; flex-direction: row; gap: 16px; align-items: flex-start; }
  .card-label {
    font-family: 'Rubik', sans-serif; font-size: 11px; font-weight: 600;
    color: var(--sh-text-tip); letter-spacing: 0.4px;
  }
  .dm-toggle {
    position: fixed; bottom: 8px; left: 8px; z-index: 50;
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(127,155,217,0.45);
    background: rgba(255,255,255,0.65);
    color: var(--sh-text-dark);
    font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const {
    Sidebar, TopBar, CourseCard, COURSES,
    TopicCard, QuizIntroCard, DifficultySelectorCard,
  } = window.WaffleStackDesignSystem_a43b54;

  function Demo() {
    const [dark, setDark] = React.useState(false);
    const toggleDark = () => {
      document.documentElement.classList.toggle('dark');
      setDark(d => !d);
    };
    const [diffSelected, setDiffSelected] = React.useState(true);

    return (
      <React.Fragment>
        <div className="card-shell">
          {/* Sidebar — first flex child in RTL, so it sits on the RIGHT */}
          <Sidebar activeItem="courses" onNavigate={() => {}} />

          <div className="card-main">
            <TopBar
              title="אזור למידה"
              userName="ברק"
              xp={1240}
              darkMode={dark}
              onToggleDark={toggleDark}
              onLogout={() => {}}
              potionsSlot={
                <span style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 16 }}>
                  <span title="שיקוי ריכוז">🧪</span>
                  <span title="שיקוי רמז">🔮</span>
                </span>
              }
            />

            <div className="card-content">
              <div>
                <div className="card-label" style={{ marginBottom: 8 }}>CourseCard × 2 (COURSES data) + TopicCard</div>
                <div className="card-row-cards">
                  <CourseCard course={COURSES[0]} onSelect={() => {}} />
                  <CourseCard course={COURSES[1]} onSelect={() => {}} />
                  <TopicCard
                    topic={{ id: 'mean', label: 'ממוצע', building: 'מדדי מרכז', questionCount: 12 }}
                    progress={{ mastered: true, bestScore: 92, sessionsAttempted: 5 }}
                    planHint="מומלץ לחזק לפני מבחן אמצע"
                    onSelectTopic={() => {}}
                  />
                </div>
              </div>

              <div>
                <div className="card-label" style={{ marginBottom: 8 }}>QuizIntroCard + DifficultySelectorCard</div>
                <div className="card-row-quiz">
                  <QuizIntroCard
                    topicName="סטיית תקן"
                    counts={{ all: 24, easy: 9, medium: 10, hard: 5 }}
                    hasLesson={true}
                    onStart={() => {}}
                    onBack={() => {}}
                    onReadLesson={() => {}}
                  />
                  <div style={{ width: 130, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 10, paddingTop: 32 }}>
                    <DifficultySelectorCard
                      label="בינוני" count={10} icon="⚡"
                      color="#f59e0b" bg="rgba(245,158,11,0.12)"
                      selected={diffSelected} onClick={() => setDiffSelected(s => !s)} />
                    <DifficultySelectorCard
                      label="מאתגר" count={0} icon="🔥"
                      color="#ef4444" bg="rgba(239,68,68,0.12)"
                      selected={false} disabled={true} onClick={() => {}} />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button className="dm-toggle" aria-label="Toggle dark mode" onClick={toggleDark}>
          {dark ? '☀' : '☾'}
        </button>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
