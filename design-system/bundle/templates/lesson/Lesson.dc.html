<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script>
// Renders every .ws-katex[data-latex] once window.katex is available.
// Mirrors LessonScreen's KatexFormula fallback behaviour (throwOnError:false,
// plain-text fallback while the CDN script races the first paint).
(function () {
  function renderAll() {
    if (!window.katex) return;
    var els = document.querySelectorAll('.ws-katex[data-latex]:not([data-ws-done])');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      try {
        el.innerHTML = window.katex.renderToString(el.getAttribute('data-latex'), {
          throwOnError: false,
          displayMode: el.getAttribute('data-display') === '1',
          output: 'html'
        });
      } catch (e) { el.textContent = el.getAttribute('data-latex'); }
      el.setAttribute('data-ws-done', '1');
    }
  }
  var t = setInterval(renderAll, 200);
  setTimeout(function () { clearInterval(t); }, 30000);
})();
</script>
