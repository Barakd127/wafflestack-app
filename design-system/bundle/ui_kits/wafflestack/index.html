<!-- @dsCard group="WaffleStack App" viewport="1180x720" name="WaffleStack — interactive app" subtitle="Landing → study hub → lesson → quiz. The real screens, extracted from code." -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--sh-page-bg); background-attachment: fixed; font-family: 'Heebo', system-ui, sans-serif; }
  .kit-tabs { display: flex; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.72); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(51,81,202,0.18); flex-shrink: 0; }
  .kit-tab { border: 1px solid rgba(51,81,202,0.25); background: rgba(255,255,255,0.6); color: #1F3E6C; font: 600 13px 'Rubik', 'Heebo', sans-serif; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .kit-tab[aria-selected="true"] { background: #122460; color: #fff; border-color: #122460; }
  .kit-note { margin-inline-start: auto; align-self: center; font-size: 11px; color: var(--sh-text-tip); }
  .kit-stage { flex: 1; min-height: 0; }
  .kit-stage iframe { width: 100%; height: 100%; border: 0; display: none; }
  .kit-stage iframe.active { display: block; }
</style>
</head>
<body>
  <nav class="kit-tabs" role="tablist" aria-label="מסכי האפליקציה">
    <button class="kit-tab" role="tab" aria-selected="true" data-t="landing">דף נחיתה</button>
    <button class="kit-tab" role="tab" aria-selected="false" data-t="study-hub">דף הבית</button>
    <button class="kit-tab" role="tab" aria-selected="false" data-t="lesson">שיעור</button>
    <button class="kit-tab" role="tab" aria-selected="false" data-t="quiz">תרגול</button>
    <span class="kit-note">המסכים האמיתיים — מתוך templates/ (חולצו מהקוד)</span>
  </nav>
  <div class="kit-stage">
    <iframe class="active" data-t="landing" src="../../templates/landing/Landing-standalone.html" title="דף נחיתה"></iframe>
    <iframe data-t="study-hub" src="../../templates/study-hub/StudyHub-standalone.html" title="דף הבית" loading="lazy"></iframe>
    <iframe data-t="lesson" src="../../templates/lesson/Lesson-standalone.html" title="שיעור" loading="lazy"></iframe>
    <iframe data-t="quiz" src="../../templates/quiz/Quiz-standalone.html" title="תרגול" loading="lazy"></iframe>
  </div>
  <script>
    document.querySelector('.kit-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.kit-tab');
      if (!tab) return;
      for (const t of document.querySelectorAll('.kit-tab')) t.setAttribute('aria-selected', String(t === tab));
      for (const f of document.querySelectorAll('.kit-stage iframe')) f.classList.toggle('active', f.dataset.t === tab.dataset.t);
    });
  </script>
</body>
</html>
