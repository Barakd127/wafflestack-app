<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Addendum D runtime — the city behind the glass, the frost control
   (מיקוד / הדגמה / עיר + Alt to peek), parallax, and the measured hint
   height that keeps the legend off the hint bar. The city block is inlined
   as a data URL so the Obsidian copy works offline from canvas/.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var img = document.getElementById('gmCity');
  if (img) img.src = CITY_WEBP;

  var root = document.documentElement;
  var seg = document.getElementById('frostSeg');
  var held = null;                         /* Alt "hold to look" */

  function setFrost(t, remember) {
    root.style.setProperty('--gm-t', String(t));
    if (remember) { try { localStorage.setItem('gm-frost', String(t)); } catch (e) {} }
    if (!seg) return;
    Array.prototype.forEach.call(seg.querySelectorAll('.gm-seg'), function (b) {
      b.setAttribute('aria-pressed', String(Math.abs(parseFloat(b.dataset.frost) - t) < 0.001));
    });
  }
  var saved = null;
  try { saved = localStorage.getItem('gm-frost'); } catch (e) {}
  setFrost(saved === null ? 0.85 : parseFloat(saved), false);

  if (seg) seg.addEventListener('click', function (e) {
    var b = e.target.closest('.gm-seg');
    if (b) setFrost(parseFloat(b.dataset.frost), true);
  });

  /* Alt clears the glass while held — the board's hold-to-look, on a key. */
  addEventListener('keydown', function (e) {
    if (e.key === 'Alt' && held === null) {
      held = getComputedStyle(root).getPropertyValue('--gm-t').trim() || '0.85';
      root.style.setProperty('--gm-t', '0');
    }
  });
  addEventListener('keyup', function (e) {
    if (e.key === 'Alt' && held !== null) { root.style.setProperty('--gm-t', held); held = null; }
  });
  addEventListener('blur', function () {
    if (held !== null) { root.style.setProperty('--gm-t', held); held = null; }
  });

  /* Parallax: the city drifts at 3% of the camera, clamped, so panning the
     map feels like moving behind glass rather than scrolling a backdrop. */
  var world = document.getElementById('world');
  if (world && img) {
    var clamp = function (v) { return Math.max(-40, Math.min(40, v)); };
    var sync = function () {
      var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(world.style.transform || '');
      var x = m ? parseFloat(m[1]) : 0, y = m ? parseFloat(m[2]) : 0;
      img.style.transform = 'translateX(-50%) translate3d(' + clamp(x * 0.03) + 'px,' + clamp(y * 0.03) + 'px,0)';
    };
    new MutationObserver(sync).observe(world, { attributes: true, attributeFilter: ['style'] });
    sync();
  }

  /* The legend sits above the hint bar; measure it instead of guessing. */
  var hint = document.getElementById('gmHint');
  if (hint && window.ResizeObserver) {
    var ro = new ResizeObserver(function () {
      root.style.setProperty('--gm-hint-h', hint.offsetHeight + 'px');
    });
    ro.observe(hint);
  }
  /* The toast stacks above the legend too (D4); measure it the same way so
     the gap holds whether the legend is one phone pill, a full 9-branch
     strip, or hidden entirely (0px, the formula just collapses). */
  var legend = document.getElementById('legendBar');
  if (legend && window.ResizeObserver) {
    var roLegend = new ResizeObserver(function () {
      root.style.setProperty('--gm-legend-h', (legend.hidden ? 0 : legend.offsetHeight) + 'px');
    });
    roLegend.observe(legend);
  }
  /* Coordinator review (round 2): the breadcrumb flips to the RIGHT side
     (inset-inline-start + dir="rtl") for any Hebrew-titled map — i.e. the
     normal case here — which is exactly where H1's thought tray also
     lives. Reserve the crumb's own height (plus a gap) the same way the
     legend already reserves the hint's, so the tray always starts clear
     of it regardless of which physical side the crumb ends up on. */
  var crumbBar = document.getElementById('crumbBar');
  if (crumbBar && window.ResizeObserver) {
    var roCrumb = new ResizeObserver(function () {
      root.style.setProperty('--gm-crumb-h', (crumbBar.hidden ? 0 : crumbBar.offsetHeight + 8) + 'px');
    });
    roCrumb.observe(crumbBar);
  }
  /* D4 phone rule: the legend collapses to one "n ענפים" pill at <=760px and
     expands on tap; going back to a desktop width should not leave it stuck
     collapsed, so drop the flag once we cross back over the breakpoint. */
  var lastPhone = window.innerWidth <= 760;
  addEventListener('resize', function () {
    var phone = window.innerWidth <= 760;
    if (phone !== lastPhone) {
      lastPhone = phone;
      if (!phone && typeof UI !== 'undefined') UI.legendExpanded = false;
      if (typeof renderLegend === 'function') renderLegend();
      if (typeof renderCrumbs === 'function') renderCrumbs();
    }
  });
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Equations — a Word-style equation editor on the glass map.

   Equations live inside a node's title as $...$ (the same notation Obsidian
   renders, so the Markdown export keeps them). The editor is MathLive, the
   library the WaffleStack keyboard is built on: typing / makes a fraction,
   ^ a power, _ a subscript, sqrt a root — like Word. Its virtual keyboard
   carries a וופלסטאק tab with every formula from formula-library.json (the
   same library as the app's keyboard), next to the standard number and
   symbol tabs. MathLive loads from the CDN only when a map has equations or
   the editor is opened.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var ML_URL = 'https://cdn.jsdelivr.net/npm/mathlive@0.105.3/mathlive.min.mjs';
  var ML_CSS = 'https://cdn.jsdelivr.net/npm/mathlive@0.105.3/mathlive-static.css';
  var ML = null, loading = null;

  function loadMathLive() {
    if (ML) return Promise.resolve(ML);
    if (loading) return loading;
    var link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = ML_CSS;
    document.head.appendChild(link);
    loading = import(ML_URL).then(function (m) {
      ML = m;
      try { m.MathfieldElement.soundsDirectory = null; } catch (_) {}
      /* Loaded through a dynamic import, MathLive guesses its fonts folder from
         the bundle URL and asks for .../mathlive.min.mjs/fonts/*.woff2 (about
         twenty 404s). Point it at the package's real fonts folder. */
      try { m.MathfieldElement.fontsDirectory = 'https://cdn.jsdelivr.net/npm/mathlive@0.105.3/fonts'; } catch (_) {}
      return m;
    }, function (err) { loading = null; throw err; });
    return loading;
  }

  /* ── titles: $...$ becomes rendered math ───────────────────────────── */
  var EQ_RE = /\$([^$]+)\$/g;
  /* [[Note]] and [[Note|alias]] become links. Inside Obsidian a click opens
     the note: the map posts {type:'gm:open-note', target} to its host. */
  var WL_RE = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
  function txt(x) {
    return esc(x).replace(WL_RE, function (_, target, alias) {
      var t = target.trim();
      return '<a class="gm-wlink" dir="auto" data-note="' + t + '" title="' + t + '">' + (alias || target).trim() + '</a>';
    });
  }
  function markup(latex) {
    try { return ML.convertLatexToMarkup(latex); } catch (_) { return esc('$' + latex + '$'); }
  }
  /* node.eqs line — same MathLive markup as an inline title equation, just
     without the surrounding $...$ (there's nothing to delimit: the whole
     line IS the equation). Falls back to plain escaped LaTeX before
     MathLive has loaded, same as titleHTML above. */
  window.eqLineHTML = function (latex) {
    return ML ? markup(latex) : esc(latex);
  };
  window.titleHTML = function (title) {
    var t = String(title == null ? '' : title);
    if (t.indexOf('$') < 0) return txt(t);
    var out = '', last = 0, idx = 0, m;
    EQ_RE.lastIndex = 0;
    while ((m = EQ_RE.exec(t))) {
      out += txt(t.slice(last, m.index));
      out += '<span class="gm-eq" dir="ltr" data-eq-index="' + idx + '" title="לחיצה לעריכה — click to edit">' +
        (ML ? markup(m[1]) : esc(m[0])) + '</span>';
      idx++; last = m.index + m[0].length;
    }
    return out + txt(t.slice(last));
  };
  /* Small fix (d): the legend chips, breadcrumb, quick switcher and peek
     tooltip are all secondary, non-editable surfaces - a [[wikilink]] there
     should read as plain text (its alias, or the note title), never as a
     clickable link with visible brackets, and a $...$ equation should render
     as math (once MathLive has loaded) rather than showing the raw dollar
     signs. Unlike titleHTML() above, nothing here is interactive. Equations
     are pulled out into placeholders first (their markup is already-safe
     HTML), the rest is stripped of [[...]] syntax and escaped as plain text,
     then the markup is spliced back in - so the two never get tangled by a
     naive replace-then-escape order. */
  window.chromeTitleText = function (title) {
    var t = String(title == null ? '' : title);
    var eqs = [];
    t = t.replace(EQ_RE, function (_, latex) {
      eqs.push(ML ? markup(latex) : esc(latex));
      return ' EQ' + (eqs.length - 1) + ' ';
    });
    t = t.replace(WL_RE, function (_, target, alias) { return (alias || target).trim(); });
    t = esc(t);
    t = t.replace(/ EQ(\d+) /g, function (_, i) { return eqs[+i]; });
    return t;
  };
  /* Same idea for a plain-text attribute context (a native `title=""`
     tooltip can't hold markup at all) — strip the wikilink/equation syntax
     down to plain characters, no HTML. */
  window.chromeTitlePlain = function (title) {
    var t = String(title == null ? '' : title);
    t = t.replace(EQ_RE, function (_, latex) { return latex; });
    t = t.replace(WL_RE, function (_, target, alias) { return (alias || target).trim(); });
    return t;
  };
  function eqAt(title, index) {
    var m, i = 0; EQ_RE.lastIndex = 0;
    while ((m = EQ_RE.exec(title))) { if (i++ === index) return m[1]; }
    return '';
  }
  function replaceEq(title, index, latex) {
    var i = 0;
    return title.replace(EQ_RE, function (whole) { return (i++ === index) ? '$' + latex + '$' : whole; });
  }

  /* ── styles ────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent =
    '.gm-eq{display:inline-block;unicode-bidi:isolate;cursor:pointer;border-radius:5px;padding:0 3px;vertical-align:middle;}' +

key":"s2","label":"σ₂"},{"key":"n1","label":"n₁"},{"key":"n2","label":"n₂"}],"hasEval":true,"topics":["b-diff-means"],"courseId":"stat-b"}]},{"id":"b-nonparam-reg","label":"סטטיסטיקה ב׳ — א-פרמטריים ורגרסיה","formulas":[{"id":"b_chi2","label":"סטטיסטי כי בריבוע","latex":"\\chi^2=\\sum\\dfrac{(O-E)^2}{E}","desc":"נצפה מול צפוי","slots":[{"key":"O","label":"O"},{"key":"E","label":"E"}],"hasEval":true,"topics":["b-binomial-chisquare","b-independence-mcnemar","b-variance-test"],"courseId":"stat-b"},{"id":"b_mcnemar","label":"מבחן מקנמר","latex":"\\chi^2=\\dfrac{(b-c)^2}{b+c}","desc":"תאים בלתי-מתאימים בטבלה מזווגת","slots":[{"key":"b","label":"b"},{"key":"c","label":"c"}],"hasEval":true,"topics":["b-independence-mcnemar"],"courseId":"stat-b"},{"id":"b_reg_slope","label":"שיפוע הרגרסיה","latex":"\\hat{\\beta}_1=\\dfrac{\\sum(x_i-\\bar{x})(y_i-\\bar{y})}{\\sum(x_i-\\bar{x})^2}","desc":"שיטת הריבועים הפחותים","slots":[{"key":"Sxy","label":"Σ(x-x̄)(y-ȳ)"},{"key":"Sxx","label":"Σ(x-x̄)²"}],"hasEval":true,"topics":["b-simple-regression"],"courseId":"stat-b"},{"id":"b_reg_intercept","label":"חותך הרגרסיה","latex":"\\hat{\\beta}_0=\\bar{y}-\\hat{\\beta}_1\\bar{x}","slots":[{"key":"ybar","label":"ȳ"},{"key":"b1","label":"β̂₁"},{"key":"xbar","label":"x̄"}],"hasEval":true,"topics":["b-simple-regression"],"courseId":"stat-b"},{"id":"b_r_squared","label":"מקדם ההסבר","latex":"R^2=\\dfrac{SSR}{SST}=1-\\dfrac{SSE}{SST}","desc":"שיעור השונות המוסברת","slots":[{"key":"SSR","label":"SSR"},{"key":"SST","label":"SST"}],"hasEval":true,"topics":["b-simple-regression","b-multiple-regression"],"courseId":"stat-b"},{"id":"b_slope_t","label":"מבחן t לשיפוע","latex":"t=\\dfrac{\\hat{\\beta}_1}{SE(\\hat{\\beta}_1)}","desc":"H₀: השיפוע באוכלוסייה הוא אפס","slots":[{"key":"b1","label":"β̂₁"},{"key":"seb1","label":"SE"}],"hasEval":true,"topics":["b-simple-regression"],"courseId":"stat-b"}]}];

  /* Topic tabs instead of one 32-row sheet that covered the whole screen.
     MathLive shows every layout as a tab; five topics keep each sheet to a
     few rows. Category ids follow src/data/formula-library.ts. */
  var KB_TABS = [
    { label: 'מרכז ופיזור', cats: ['center', 'dispersion', 'transform'] },
    { label: 'קשרים', cats: ['correlation', 'regression'] },
    { label: 'הסתברות', cats: ['combinatorics', 'probability', 'binomial'] },
    { label: 'התפלגויות', cats: ['normal', 'rv'] },
    { label: 'סטטיסטיקה ב׳', cats: ['b-sampling', 'b-inference', 'b-nonparam-reg'] }
  ];
  function rowsFor(cats) {
    var rows = [];
    cats.forEach(function (c) {
      var fs = (c.formulas || []).filter(function (f) { return f && f.latex; });
      if (!fs.length) return;
      rows.push([{ class: 'separator w10 gm-kb-sep', label: c.label }]);
      for (var i = 0; i < fs.length; i += 5) rows.push(fs.slice(i, i + 5).map(chip));
    });
    return rows;
  }
  function buildLayouts(cats) {
    var byId = {}, used = {};
    (cats || []).forEach(function (c) { byId[c.id] = c; });
    var tabs = KB_TABS.map(function (t) {
      var picked = t.cats.map(function (id) { used[id] = 1; return byId[id]; }).filter(Boolean);
      var rows = rowsFor(picked);
      return rows.length ? { label: t.label, tooltip: 'נוסחאות וופלסטאק: ' + t.label, rows: rows } : null;
    }).filter(Boolean);
    /* a category added to the library later still appears, on its own tab */
    var rest = (cats || []).filter(function (c) { return !used[c.id]; });
    if (rest.length) tabs.push({ label: 'עוד', tooltip: 'נוסחאות נוספות', rows: rowsFor(rest) });
    return tabs.concat(['numeric', 'symbols', 'greek']);
  }
  var kbListening = false;
  function registerKeyboard() {
    if (kbDone || kbLoading || !window.mathVirtualKeyboard) return;
    kbLoading = true;
    var kb = window.mathVirtualKeyboard;
    if (!kbListening) {
      kbListening = true;
      try { kb.addEventListener('geometrychange', avoidKeyboard); } catch (_) {}
    }
    var apply = function (cats) { kb.layouts = buildLayouts(cats); kbDone = true; };
    fetch('formula-library.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(apply, function () { apply(FORMULA_INLINE); })
      .then(function () { kbLoading = false; }, function () { kbLoading = false; });
  }

  /* ── formula autocomplete ("חיפוש נוסחה") ─────────────────────────────
     Same source the keyboard uses above: the live formula-library.json when
     it can be fetched, else the embedded FORMULA_INLINE — flattened once
     into a single searchable list (id/label/desc/shortLabel/latex/full
     latex-as-tokens), cached across opens of the editor. */
  var FORMULA_FLAT = null, flatLoading = null;
  function flattenFormulaCats(cats) {
    var out = [];
    (cats || []).forEach(function (c) {
      (c.formulas || []).forEach(function (f) {
        if (!f || !f.latex) return;
        var eq = f.latex.indexOf('=');
        var shortLabel = f.shortLabel || (eq === -1 ? f.latex : f.latex.slice(0, eq).trim());
        out.push({ id: f.id || '', label: f.label || '', desc: f.desc || '', shortLabel: shortLabel, latex: f.latex });
      });
    });
    return out;
  }
  function loadFormulaFlat() {
    if (FORMULA_FLAT) return Promise.resolve(FORMULA_FLAT);
    if (flatLoading) return flatLoading;
    flatLoading = fetch('formula-library.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (cats) { FORMULA_FLAT = flattenFormulaCats(cats); return FORMULA_FLAT; },
            function () { FORMULA_FLAT = flattenFormulaCats(FORMULA_INLINE); return FORMULA_FLAT; });
    return flatLoading;
  }
  /* Case-insensitive, ignoring Hebrew punctuation (geresh/gershayim, the two
     marks Hebrew abbreviations and loanwords use — ׳ ״ — plus their ASCII
     stand-ins ' "), so "מקדם r" and "מקדם r'" both find the same formula. */
  function normEqQuery(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[׳״'"`]/g, '').replace(/\s+/g, ' ').trim();
  }
  function searchFormulas(list, q) {
    var nq = normEqQuery(q);
    if (!nq) return [];
    var scored = [];
    list.forEach(function (f) {
      var fields = [[f.label, 4], [f.shortLabel, 3], [f.id, 2], [f.desc, 2], [f.latex, 1]];
      var best = -1;
      fields.forEach(function (pair) {
        var nv = normEqQuery(pair[0]);
        if (nv && nv.indexOf(nq) >= 0) best = Math.max(best, pair[1]);
      });
      if (best >= 0) scored.push({ f: f, score: best });
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, 8).map(function (x) { return x.f; });
  }
  var EQSUG = { results: [], idx: -1 };
  function renderEqSuggest() {
    var box = document.getElementById('eqSuggest');
    if (!box) return;
    if (!EQSUG.results.length) { box.hidden = true; box.innerHTML = ''; }
    else {
      box.hidden = false;
      box.innerHTML = EQSUG.results.map(function (f, i) {
        var short = ML ? markup(f.shortLabel || f.latex) : esc(f.shortLabel || f.latex);
        return '<div class="gm-eq-suggest-row' + (i === EQSUG.idx ? ' active' : '') + '" role="option" data-eqsug="' + i + '">' +
          '<span class="lbl gm-bidi">' + esc(f.label || f.id) + '</span><span class="shortmf">' + short + '</span></div>';
      }).join('');
      var activeRow = box.querySelector('.gm-eq-suggest-row.active');
      if (activeRow && activeRow.scrollIntoView) activeRow.scrollIntoView({ block: 'nearest' });
    }
    /* The list just grew/shrank the panel (it's normal flow now, not an
       absolutely-positioned overlay) — re-run place() so the panel re-clamps
       against the current viewport, or flips above the node, instead of
       running its new, taller self past the bottom of the screen. */
    if (!panel.hidden && EQ.node) place(EQ.node);
  }
  function runEqSearch(q) {
    loadFormulaFlat().then(function (list) {
      EQSUG.results = searchFormulas(list, q);
      EQSUG.idx = EQSUG.results.length ? 0 : -1;
      renderEqSuggest();
    });
  }
  function insertFormulaAt(i) {
    var f = EQSUG.results[i]; var mf = field();
    if (!f || !mf) return;
    mf.insert(f.latex);
    EQSUG.results = []; EQSUG.idx = -1; renderEqSuggest();
    var input = document.getElementById('eqSearchInput'); if (input) input.value = '';
    mf.focus({ preventScroll: true });
    resetPageScroll();
  }

  /* When the keyboard slides up, lift the editor above it. */
  function avoidKeyboard() {
    var kb = window.mathVirtualKeyboard;
    if (panel.hidden) return;
    if (!kb || !kb.visible) { if (EQ.node) place(EQ.node); return; }
    var r = kb.boundingRect;
    if (!r || !r.height) return;
    var h = panel.offsetHeight || 180;
    var top = Math.min(parseFloat(panel.style.top) || 0, r.top - h - 10);
    panel.style.top = Math.max(64, top) + 'px';
  }

  /* ── wiring ────────────────────────────────────────────────────────── */
  panel.addEventListener('click', function (e) {
    var sug = e.target.closest('[data-eqsug]');
    if (sug) { insertFormulaAt(+sug.dataset.eqsug); return; }
    if (e.target.closest('#eqInsert')) { insertEquation(); return; }
    if (e.target.closest('#eqCancel')) { closeEquation(); return; }
    if (e.target.closest('#eqDelete')) { deleteEquation(); return; }
    if (e.target.closest('#eqKbd')) {
      var kb = window.mathVirtualKeyboard, mf = field();
      if (!kb || !mf) return;
      mf.focus({ preventScroll: true });
      resetPageScroll();
      if (kb.visible) kb.hide(); else kb.show();
      setTimeout(avoidKeyboard, 350);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (panel.hidden || e.key !== 'Escape') return;
    /* Esc closes the suggestions dropdown first, the editor only on the
       NEXT Esc (contract: "Esc closes the suggestions first, then the
       editor"). */
    if (EQSUG.results.length) { e.preventDefault(); e.stopPropagation(); EQSUG.results = []; EQSUG.idx = -1; renderEqSuggest(); return; }
    e.preventDefault(); e.stopPropagation(); closeEquation();
  }, true);
  document.addEventListener('pointerdown', function (e) {
    if (panel.hidden) return;
    if (e.target.closest && e.target.closest('#eqPanel, .ML__keyboard, .gm-eq')) return;
    closeEquation();
  }, true);
  /* ── autocomplete wiring ───────────────────────────────────────────── */
  panel.addEventListener('input', function (e) {
    if (e.target.id === 'eqSearchInput') runEqSearch(e.target.value);
  });
  panel.addEventListener('keydown', function (e) {
    if (e.target.id !== 'eqSearchInput') return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (EQSUG.results.length) { EQSUG.idx = Math.min(EQSUG.results.length - 1, EQSUG.idx + 1); renderEqSuggest(); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (EQSUG.results.length) { EQSUG.idx = Math.max(0, EQSUG.idx - 1); renderEqSuggest(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (EQSUG.idx >= 0) insertFormulaAt(EQSUG.idx);
    }
    /* Escape is handled by the document-level capture listener above (it
       needs to beat MathLive/editor-wide Escape handling the same way). */
  });

  window.openEquation = openEquation;
  window.__eqAutocomplete = { get results() { return EQSUG.results; }, get idx() { return EQSUG.idx; } };  /* test hook */
  window.closeEquation = closeEquation;

  /* A map that already holds equations loads MathLive straight away and
     re-renders — legacy $...$-in-title text becomes math, and node.eqs
     lines (Barak, 13.09) become MathLive markup instead of raw LaTeX. The
     re-render after document.fonts.ready is what re-triggers settleMap()
     once the real (font-loaded) size of every equation line is known, so
     nothing added while offline ends up overlapping once the fonts arrive. */
  if ((S.nodes || []).some(function (n) { return (n.title && n.title.indexOf('$') >= 0) || (n.eqs && n.eqs.length); })) {
    loadMathLive().then(function () {
      render();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
    }, function () {});
  } else {
    render();
  }
  var origOpen = openEquation;
  window.openEquation = function (a, b) {
    loadMathLive().then(function () {
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
    }, function () {});
    return origOpen(a, b);
  };
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Addendum G — batch copy of open questions to Claude, paste-back of
   answers, and "copy a branch with context".

   The Markdown block's shape is the contract's own literal template
   (English framing so any assistant parses it, Hebrew content as written),
   grouped by top-level branch, in tree order. Paste-back re-derives the SAME
   ordered list of open questions at apply-time (rather than trusting a
   stale mapping from whenever the copy happened) and matches by position,
   which is exactly the order the copy itself was just built in.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  function ic(p) {
    return '<svg class="gm-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }

  /* ── styles ──────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent =
    '.gm-copy-dialog,.gm-paste-dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;' +
      'width:min(560px,calc(100vw - 24px));max-height:80vh;display:flex;flex-direction:column;gap:10px;' +
      'padding:16px;border-radius:16px;box-sizing:border-box;}' +
    '.gm-copy-dialog[hidden],.gm-paste-dialog[hidden]{display:none;}' +
    '.gm-copy-dialog h2,.gm-paste-dialog h2{margin:0;font-size:15px;color:var(--sh-text-dark);}' +
    '.gm-copy-dialog textarea,.gm-paste-dialog textarea{width:100%;min-height:260px;max-height:50vh;box-sizing:border-box;' +
      'padding:10px 12px;border-radius:10px;border:1px solid var(--sh-line);background:rgba(255,255,255,.5);' +
      'font:12.5px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;direction:ltr;resize:vertical;}' +
    '.gm-copy-actions{display:flex;justify-content:flex-end;gap:8px;}' +
    '.gm-q-notes-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sh-text-med);}';
  document.head.appendChild(css);

  /* ── the fallback copy dialog (clipboard API unavailable/denied) ──────── */
  var copyDialog = document.createElement('div');
  copyDialog.id = 'copyDialog';
  copyDialog.className = 'gm-copy-dialog gm-glass';
  copyDialog.setAttribute('data-float', 'copydialog');
  copyDialog.setAttribute('data-chrome', '1');
  copyDialog.setAttribute('role', 'dialog');
  copyDialog.setAttribute('dir', 'rtl');
  copyDialog.hidden = true;
  copyDialog.innerHTML =
    '<h2 class="gm-bidi" title="Copy manually">העתק ידנית: <kbd dir="ltr">Ctrl/Cmd+C</kbd></h2>' +
    '<textarea id="copyDialogTa" dir="ltr" readonly></textarea>' +
    '<div class="gm-copy-actions"><button class="gm-btn on" id="copyDialogClose" title="Close" aria-label="Close">' + ic('<path d="M18 6 6 18M6 6l12 12"/>') + '<span>סגור</span></button></div>';
  document.body.appendChild(copyDialog);
  function openCopyDialog(text) {
    var ta = copyDialog.querySelector('#copyDialogTa');
    ta.value = text;
    copyDialog.hidden = false;
    requestAnimationFrame(function () { ta.focus({ preventScroll: true }); ta.select(); resetPageScroll(); });
  }
  function closeCopyDialog() { copyDialog.hidden = true; var mw = el('#mapwrap'); if (mw) mw.focus(); }
  window.closeCopyDialog = closeCopyDialog;
  document.addEventListener('keydown', function (e) {
    if (!copyDialog.hidden && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeCopyDialog(); }
  }, true);

  function writeClipboardOrDialog(text) {
    function fallback() { openCopyDialog(text); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  window.writeClipboardOrDialog = writeClipboardOrDialog;

  /* ── the paste-back dialog ("הדבק תשובות") ─────────────────────────────── */
  var pasteDialog = document.createElement('div');
  pasteDialog.id = 'pasteDialog';
  pasteDialog.className = 'gm-paste-dialog gm-glass';
  pasteDialog.setAttribute('data-float', 'pastedialog');
  pasteDialog.setAttribute('data-chrome', '1');
  pasteDialog.setAttribute('role', 'dialog');
  pasteDialog.setAttribute('dir', 'rtl');
  pasteDialog.hidden = true;
  pasteDialog.innerHTML =
    '<h2 class="gm-bidi" title="Paste Claude’s reply">הדבק תשובות</h2>' +
    '<textarea id="pasteAnswersTa" dir="auto" placeholder="## Q1. ...\nתשובה…"></textarea>' +
    '<div class="gm-copy-actions">' +
      '<button class="gm-btn" id="pasteCancelBtn" title="Cancel" aria-label="Cancel">' + ic('<path d="M18 6 6 18M6 6l12 12"/>') + '<span>ביטול</span></button>' +
      '<button class="gm-btn on" id="pasteApplyBtn" title="Apply" aria-label="Apply">' + ic('<path d="M20 6 9 17l-5-5"/>') + '<span>החל</span></button>' +
    '</div>';
  document.body.appendChild(pasteDialog);
  function openPasteAnswersDialog() {
    pasteDialog.hidden = false;
    var ta = pasteDialog.querySelector('#pasteAnswersTa');
    ta.value = '';
    requestAnimationFrame(function () { ta.focus({ preventScroll: true }); resetPageScroll(); });
  }
  function closePasteAnswersDialog() { pasteDialog.hidden = true; var mw = el('#mapwrap'); if (mw) mw.focus(); }
  window.openPasteAnswersDialog = openPasteAnswersDialog;
  window.closePasteAnswersDialog = closePasteAnswersDialog;
  document.addEventListener('keydown', function (e) {
    if (!pasteDialog.hidden && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePasteAnswersDialog(); }
  }, true);

  /* ── grouping: top-level branch → open questions, tree order ──────────── */
  function collectOpenQuestionsGrouped() {
    var root = rootNode();
    var groups = [];
    childrenOf(root.id).forEach(function (b) {
      var qs = [];
      (function walk(id) {
        var n = N(id);
        if (isOpenQuestion(n)) qs.push(n);
        childrenOf(id).forEach(function (c) { walk(c.id); });
      })(b.id);
      if (qs.length) groups.push({ branch: b, questions: qs });
    });
    return groups;
  }
  function orderedOpenQuestions() {
    var out = [];
    collectOpenQuestionsGrouped().forEach(function (g) { g.questions.forEach(function (q) { out.push(q); }); });
    return out;
  }
  function notesUnder(branchId) {
    var out = [];
    (function walk(id) {
      var n = N(id);
      if (n.kind === 'note') out.push(n);
      childrenOf(id).forEach(function (c) { walk(c.id); });
    })(branchId);
    return out;
  }
  function wikilinksIn(text) {
    var out = [], re = /\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, m;
    while ((m = re.exec(text || ''))) out.push(m[1]);
    return out;
  }
  function buildQuestionSection(node, qi) {
    var chain = ancestorChain(node.id);            /* root … parent, node (inclusive) */
    var parent = node.parent != null ? N(node.parent) : null;
    var siblings = parent ? childrenOf(parent.id).filter(function (s) { return s.id !== node.id; }).slice(0, 6) : [];
    var links = linksOf(node.id).map(function (l) {
      var otherId = l.from === node.id ? l.to : l.from, other = N(otherId);
      return (other ? (other.title || '···') : '?') + (l.label ? ' (' + l.label + ')' : '');
    });
    var eqs = [];
    if (node.eqs && node.eqs.length) eqs = eqs.concat(node.eqs);
    if (parent && parent.eqs && parent.eqs.length) eqs = eqs.concat(parent.eqs);
    var linkedNotes = [];
    chain.forEach(function (n) { linkedNotes = linkedNotes.concat(wikilinksIn(n.title)).concat(wikilinksIn(n.body)); });
    var lines = [];
    lines.push('## Q' + qi + '. ' + (node.title || '···'));
    lines.push('- Path: ' + chain.map(function (n) { return n.title || '···'; }).join(' › '));
    if (parent) {
      var trimmed = (parent.body || '').trim();
      if (trimmed.length > 400) trimmed = trimmed.slice(0, 400) + '…';
      lines.push('- Parent concept: ' + (parent.title || '···') + '. My notes on it: ' + trimmed);
    }
    if (siblings.length) lines.push('- Siblings: ' + siblings.map(function (s) { return s.title || '···'; }).join(', '));
    if (links.length) lines.push('- My links: ' + links.join(', '));
    if (eqs.length) lines.push('- Equations: ' + eqs.map(function (e) { return '$$' + e + '$$'; }).join(', '));
    if (linkedNotes.length) lines.push('- Linked notes: ' + linkedNotes.map(function (t) { return '[[' + t + ']]'; }).join(', '));
    lines.push('- Asked: ' + (node.q && node.q.asked ? new Date(node.q.asked).toLocaleDateString() : ''));
    return lines.join('\n');
  }
  function copyOpenQuestionsToClaude() {
    var includeNotes = false;
    var cb = document.getElementById('qIncludeNotes');
    if (cb) includeNotes = !!cb.checked;
    var groups = collectOpenQuestionsGrouped();
    var total = 0; groups.forEach(function (g) { total += g.questions.length; });
    var unlinked = (S.inbox || []).slice();
    if (!total && !unlinked.length) { toast('אין שאלות פתוחות'); return; }
    var header = "I'm studying the HUJI AI Engineers course. These are my open questions from my study map \"" + S.title + "\".\n" +
      "For each question, use its path, my notes and the nearby concepts as context. Where it helps, bridge to SPSS or\n" +
      "psychology statistics and say where the analogy breaks. Answer each under its own heading.";
    var sections = [], qi = 1;
    groups.forEach(function (g) {
      g.questions.forEach(function (q) { sections.push(buildQuestionSection(q, qi++)); });
      if (includeNotes) {
        notesUnder(g.branch.id).forEach(function (nt) {
          sections.push('### הערה — ' + (nt.title || '') + (nt.body ? '\n' + nt.body : ''));
        });
      }
    });
    /* H1: unlinked thought bubbles get a final section of their own, English
       heading (same framing as the "## Qn." headings) since the rest of the
       block is written so any assistant parses it. */
    if (unlinked.length) {
      sections.push('## Unlinked thoughts\n' + unlinked.map(function (b) { return '- ' + (b.text || ''); }).join('\n'));
    }
    writeClipboardOrDialog(header + '\n\n' + sections.join('\n\n'));
    toast('הועתקו <bdi>' + total + '</bdi> שאלות' + (unlinked.length ? ' + <bdi>' + unlinked.length + '</bdi> מחשבות' : ''), { html: true });
  }
  window.copyOpenQuestionsToClaude = copyOpenQuestionsToClaude;

  /* ── paste-back: split on "## Q<n>" headings, one undo step for all ────── */
  function parseAnswersByQ(text) {
    var re = /##\s*Q(\d+)\b[^\n]*\n([\s\S]*?)(?=\n##\s*Q\d+\b|$)/gi;
    var out = {}, m;
    while ((m = re.exec(text))) out[+m[1]] = m[2].trim();
    return out;
  }
  function applyPastedAnswers(text) {
    var ordered = orderedOpenQuestions();
    var parsed = parseAnswersByQ(text);
    var count = 0;
    ordered.forEach(function (q, idx) {
      var v = parsed[idx + 1];
      if (v != null) { q.answer = v; count++; }
    });
    if (!count) { toast('לא נמצאו תשובות תואמות'); return; }
    save();     /* one save() = one undo step, reverting every answer at once */
    render();
    toast('עודכנו <bdi>' + count + '</bdi> תשובות — <kbd dir="ltr">Ctrl+Z</kbd> לביטול הכל', { html: true });
  }
  function applyPastedAnswersFromDialog() {
    var ta = document.getElementById('pasteAnswersTa');
    var text = ta ? ta.value : '';
    closePasteAnswersDialog();
    applyPastedAnswers(text);
  }
  window.applyPastedAnswersFromDialog = applyPastedAnswersFromDialog;

  /* ── "העתק ענף עם הקשר" — copy any branch as an indented outline ───────── */
  function copyBranchWithContext() {
    var id = UI.sel;
    if (!id) { toast('בחר ענף להעתקה'); return; }
    var node = N(id);
    var lines = [];
    (function walk(n, depth) {
      lines.push('  '.repeat(depth) + '- ' + (n.title || '···'));
      if (n.body) lines.push('  '.repeat(depth + 1) + n.body.trim());
      (n.eqs || []).forEach(function (e) { lines.push('  '.repeat(depth + 1) + '$$' + e + '$$'); });
      childrenOf(n.id).forEach(function (c) { walk(c, depth + 1); });
    })(node, 0);
    writeClipboardOrDialog(lines.join('\n'));
    toast('הענף הועתק');
  }
  window.copyBranchWithContext = copyBranchWithContext;
  window.orderedOpenQuestions = orderedOpenQuestions;
  window.collectOpenQuestionsGrouped = collectOpenQuestionsGrouped;
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Images — paste (Ctrl+V) or drop an image straight onto the map.

   Placement: a new child of the selected node, of the node it was dropped
   ON, or of the root when nothing is selected — EXCEPT Shift+Ctrl+V, the
   "attach" gesture, which sets the image on the currently selected node
   itself instead of making a child. Every image is downscaled in a canvas
   (longest side 480px, JPEG q=0.75) before it ever touches node.img, and
   refused with a toast if it's still over 150KB after that, or if the map
   already holds 40 images — so a full-resolution phone photo can never
   quietly bloat localStorage or a JSON export.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var MAX_IMAGES = 40;
  var MAX_IMG_BYTES = 150 * 1024;
  var IMG_MAX_DIM = 480;
  var IMG_QUALITY = 0.75;

  /* ── styles ────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent =
    '.gm-thumb{display:block;margin-top:6px;max-width:220px;width:100%;height:auto;' +
      'border-radius:10px;cursor:zoom-in;box-shadow:0 2px 8px rgba(31,41,55,.22);}' +
    '.gm-lightbox{position:fixed;inset:0;z-index:75;display:grid;place-items:center;' +
      'background:rgba(15,25,50,.55);opacity:0;pointer-events:none;transition:opacity .18s ease;cursor:zoom-out;}' +
    '.gm-lightbox.open{opacity:1;pointer-events:auto;}' +
    '.gm-lightbox[hidden]{display:none;}' +
    '.gm-lightbox-card{padding:10px;border-radius:18px;max-width:92vw;max-height:90vh;}' +
    '.gm-lightbox-card img{display:block;max-width:min(88vw,880px);max-height:80vh;border-radius:12px;}';
  document.head.appendChild(css);

  /* ── the glass lightbox — click or Esc closes ─────────────────────── */
  var box = document.createElement('div');
  box.className = 'gm-lightbox';
  box.setAttribute('data-float', 'lightbox');
  box.setAttribute('data-chrome', '1');
  box.hidden = true;
  box.innerHTML = '<div class="gm-lightbox-card gm-glass"><img alt=""></div>';
  document.body.appendChild(box);
  function openLightbox(src) {
    if (!src) return;
    box.querySelector('img').src = src;
    box.hidden = false;
    requestAnimationFrame(function () { box.classList.add('open'); });
  }
  function closeLightbox() {
    if (box.hidden) return;
    box.classList.remove('open');
    setTimeout(function () { box.hidden = true; }, 180);
  }
  box.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function (e) {
    if (!box.hidden && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLightbox(); }
  }, true);
  window.openLightbox = openLightbox;

  /* ── Shift held? A paste event carries no reliable modifier state of its
     own, so track it the same way the D-runtime script already tracks Alt
     for "hold to look". ─────────────────────────────────────────────── */
  var shiftHeld = false;
  document.addEventListener('keydown', function (e) { if (e.key === 'Shift') shiftHeld = true; }, true);
  document.addEventListener('keyup', function (e) { if (e.key === 'Shift') shiftHeld = false; }, true);
  addEventListener('blur', function () { shiftHeld = false; });

  /* ── downscale + budget ────────────────────────────────────────────── */
  function countImages() { return S.nodes.filter(function (n) { return !!n.img; }).length; }
  function dataUrlBytes(u) {
    var i = u.indexOf(','), b64 = i >= 0 ? u.slice(i + 1) : u;
    return Math.ceil(b64.length * 3 / 4);
  }
  function loadImageFile(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  function downscaleToJPEG(img) {
    var w = img.naturalWidth || img.width || 1, h = img.naturalHeight || img.height || 1;
    var scale = Math.min(1, IMG_MAX_DIM / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    c.getContext('2d').drawImage(img, 0, 0, cw, ch);
    return c.toDataURL('image/jpeg', IMG_QUALITY);
  }
  function placementParent(opts) {
    if (opts.dropNodeId && N(opts.dropNodeId)) return opts.dropNodeId;
    if (UI.sel && N(UI.sel)) return UI.sel;
    return rootNode().id;
  }

  /* file -> downscaled data URL -> onto the map, per the rules above. */
  function handleIncomingImage(file, opts) {
    opts = opts || {};
    loadImageFile(file).then(function (img) {
      var dataUrl = downscaleToJPEG(img);
      var bytes = dataUrlBytes(dataUrl);
      if (bytes > MAX_IMG_BYTES) {
        toast('התמונה גדולה מדי גם אחרי כיווץ (מעל 150KB)');
        return;
      }
      if (opts.attach) {
        var node = UI.sel && N(UI.sel);
        if (!node) { toast('בחר נושא קודם כדי לצרף תמונה'); return; }
        if (!node.img && countImages() >= MAX_IMAGES) {
          toast('הגיעה למגבלת 40 תמונות במפה');
          return;
        }
        node.img = dataUrl;
        save(); render();
        toast('התמונה צורפה לנושא');
        return;
      }
      if (countImages() >= MAX_IMAGES) {
        toast('הגיעה למגבלת 40 תמונות במפה');
        return;
      }
      var pid = placementParent(opts);
      var id = uid('n');
      S.nodes.push({ id: id, parent: pid, title: '', body: '', accent: accentFor(pid), img: dataUrl });
      UI.sel = id;
      mapView().touched = true;
      save(); render();
      var n = el('.gm-node[data-node="' + id + '"]');
      if (n) ensureVisible(n);
      toast('נוספה תמונה');
    }, function () {
      toast('לא ניתן היה לטעון את התמונה');
    });
  }

  /* ── paste ─────────────────────────────────────────────────────────── */
  document.addEventListener('paste', function (ev) {
    if (inField()) return;
    var items = (ev.clipboardData && ev.clipboardData.items) || [];
    var file = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { file = items[i].getAsFile(); break; }
    }
    if (!file) return;
    ev.preventDefault();
    handleIncomingImage(file, { attach: !!(ev.shiftKey || shiftHeld) });
  });

  /* ── drop ──────────────────────────────────────────────────────────── */
  var wrap = el('#mapwrap');
  if (wrap) {
    wrap.addEventListener('dragover', function (e) { e.preventDefault(); });
    wrap.addEventListener('drop', function (e) {
      var dt = e.dataTransfer;
      if (!dt || !dt.files || !dt.files.length) return;
      var file = null;
      for (var i = 0; i < dt.files.length; i++) {
        if (/^image\//.test(dt.files[i].type)) { file = dt.files[i]; break; }
      }
      if (!file) return;
      e.preventDefault();
      var hostNode = e.target.closest && e.target.closest('.gm-node');
      handleIncomingImage(file, { dropNodeId: hostNode ? hostNode.dataset.node : null });
    });
  }

  /* ── anti-overlap: a thumbnail's real height is unknown until it loads,
     so re-settle once it does (contract: "re-run settleMap() so nothing
     overlaps"). Runs after every render() via RENDER_HOOKS — a fresh <img>
     element every time (render() replaces #world's whole subtree), so the
     "already bound" guard is per-element, not per-node. ───────────────── */
  RENDER_HOOKS.push(function () {
    els('.gm-thumb[data-gm-thumb]').forEach(function (img) {
      if (img.dataset.gmBound) return;
      img.dataset.gmBound = '1';
      if (img.complete && img.naturalWidth) { settleMap(); return; }
      img.addEventListener('load', function () { settleMap(); }, { once: true });
    });
  });
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Diagrams — a quick Mermaid editor on the glass map (Alt+M / rail button).

   Mermaid source lives in node.diagram and renders as an inline SVG inside
   the card; Obsidian renders the same source natively from the Markdown
   export's ```mermaid fence, so nothing here is GlassMap-only notation.
   Mermaid itself loads lazily from a PINNED jsdelivr URL (verified with
   curl to return 200 before this shipped — contract note: "a previous
   builder shipped 404 CDN paths").
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var MERMAID_URL = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
  var MMD = null, mmdLoading = null, mmdInit = false, mmdSeq = 0;
  function loadMermaid() {
    if (MMD) return Promise.resolve(MMD);
    if (mmdLoading) return mmdLoading;
    mmdLoading = import(MERMAID_URL).then(function (m) {
      MMD = m.default || m;
      if (!mmdInit) {
        mmdInit = true;
        try { MMD.initialize({ startOnLoad: false, securityLevel: 'strict', theme: resolveTheme() ? 'dark' : 'neutral' }); } catch (e) {}
      }
      return MMD;
    }, function (err) { mmdLoading = null; throw err; });
    return mmdLoading;
  }
  function renderMermaidTo(container, source) {
    return loadMermaid().then(function (m) {
      var id = 'gmmmd' + (mmdSeq++);
      return m.render(id, source).then(function (res) { container.innerHTML = res.svg; });
    });
  }

  /* ── styles ────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent =
    '.gm-diagram{margin-top:6px;max-width:320px;cursor:pointer;border-radius:10px;overflow:hidden;' +
      'background:rgba(255,255,255,.5);padding:6px;box-shadow:0 2px 8px rgba(31,41,55,.16);}' +
    '.gm-diagram svg{max-width:100%;height:auto;display:block;}' +
    '.gm-diagram-loading{font-size:11px;color:var(--sh-text-med);}' +
    ':root[data-theme="dark"] .gm-diagram{background:rgba(255,255,255,.06);}' +
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gm-diagram{background:rgba(255,255,255,.06);}}' +
    '.gm-dg-panel{width:min(520px,calc(100vw - 24px));}' +
    '.gm-dg-chips{display:flex;flex-wrap:wrap;gap:6px;}' +
    '.gm-dg-src{width:100%;min-height:90px;max-height:220px;padding:8px 10px;border-radius:10px;box-sizing:border-box;' +
      'font:12.5px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;direction:ltr;' +
      'background:rgba(255,255,255,.9);border:1px solid rgba(31,62,108,.18);color:#1F3E6C;resize:vertical;}' +
    '.gm-dg-src:focus{outline:2px solid var(--gm-gold);outline-offset:1px;}' +
    ':root[data-theme="dark"] .gm-dg-src{background:rgba(10,15,30,.55);color:#e2e8f0;border-color:rgba(255,255,255,.16);}' +
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gm-dg-src{background:rgba(10,15,30,.55);color:#e2e8f0;border-color:rgba(255,255,255,.16);}}' +
    '.gm-dg-preview{min-height:60px;max-height:220px;overflow:auto;border-radius:10px;padding:8px;background:rgba(255,255,255,.35);}' +
    '.gm-dg-preview svg{max-width:100%;height:auto;display:block;margin:0 auto;}' +
    '.gm-dg-preview .gm-eq-loading{font-size:11px;color:var(--sh-text-med);}';
  document.head.appendChild(css);

  function ic(p) {
    return '<svg class="gm-i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  var DIAGRAM_CHIPS = [
    { key: 'flow', label: 'זרימה', src: 'flowchart LR\n  A[התחלה] --> B[שלב]\n  B --> C[סיום]' },
    { key: 'seq', label: 'רצף', src: 'sequenceDiagram\n  participant A\n  participant B\n  A->>B: הודעה' },
    { key: 'pie', label: 'עוגה', src: 'pie title כותרת\n  "א" : 40\n  "ב" : 60' },
    { key: 'cycle', label: 'מחזור', src: 'flowchart LR\n  A --> B --> C --> A' }
  ];

  /* ── the panel ─────────────────────────────────────────────────────── */
  var panel = document.createElement('div');
  panel.id = 'diagramPanel';
  panel.className = 'gm-eq-panel gm-dg-panel gm-glass';
  panel.setAttribute('data-float', 'diagram');
  panel.setAttribute('data-chrome', '1');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('dir', 'rtl');
  panel.setAttribute('aria-label', 'עורך דיאגרמות');
  panel.hidden = true;
  panel.innerHTML =
    '<div class="gm-eq-head"><span class="gm-eq-title">דיאגרמה מהירה</span>' +
    '<span class="gm-eq-sub" dir="rtl">מבוסס <bdi>Mermaid</bdi> — <bdi>Obsidian</bdi> מציג את זה ישירות</span></div>' +
    '<div class="gm-dg-chips" dir="rtl">' +
      DIAGRAM_CHIPS.map(function (c) { return '<button class="gm-btn" data-dg-chip="' + c.key + '">' + esc(c.label) + '</button>'; }).join('') +
    '</div>' +
    '<textarea id="diagramSrc" class="gm-dg-src" dir="ltr" spellcheck="false" placeholder="flowchart LR&#10;  A --&gt; B"></textarea>' +
    '<div class="gm-dg-preview" id="diagramPreview"></div>' +
    '<div class="gm-eq-actions">' +
      '<span class="gm-eq-spacer"></span>' +
      '<button class="gm-btn" id="diagramCancel" title="ביטול (Esc) — cancel">' + ic('<path d="M18 6 6 18M6 6l12 12"/>') + '<span>ביטול</span></button>' +
      '<button class="gm-btn on" id="diagramInsert" title="הכנס (Ctrl+Enter) — insert">' + ic('<path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>') + '<span>הכנס</span></button>' +
    '</div>';
  document.body.appendChild(panel);

  var DG = { nodeId: null, parentId: null };
  var srcField = panel.querySelector('#diagramSrc');
  var previewEl = panel.querySelector('#diagramPreview');

  function place(id) {
    var host = id && document.querySelector('.gm-node[data-node="' + id + '"]');
    var w = panel.offsetWidth || 520, h = panel.offsetHeight || 260;
    var r = host ? host.getBoundingClientRect() : { left: innerWidth / 2, right: innerWidth / 2, top: innerHeight / 3, bottom: innerHeight / 3, width: 0 };
    var left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 12));
    var top = r.bottom + 10;
    if (top + h > innerHeight - 12) top = r.top - h - 10;
    top = Math.max(64, Math.min(top, innerHeight - h - 12));
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  }

  var previewTimer = null;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () {
      var src = srcField.value.trim();
      if (!src) { previewEl.innerHTML = ''; return; }
      renderMermaidTo(previewEl, src).catch(function () {
        previewEl.innerHTML = '<span class="gm-eq-loading">שגיאה בתרשים</span>';
      });
    }, 250);
  }

  function openDiagramEditor(existingNodeId) {
    var node = existingNodeId && N(existingNodeId);
    if (node && node.diagram) {
      DG.nodeId = existingNodeId; DG.parentId = null;
      srcField.value = node.diagram;
    } else {
      var pid = (UI.sel && N(UI.sel)) ? UI.sel : rootNode().id;
      DG.nodeId = null; DG.parentId = pid;
      srcField.value = '';
      previewEl.innerHTML = '';
    }
    panel.hidden = false;
    place(existingNodeId || DG.parentId);
    requestAnimationFrame(function () {
      srcField.focus({ preventScroll: true });
      resetPageScroll();
      place(existingNodeId || DG.parentId);
    });
    if (srcField.value.trim()) schedulePreview();
  }
  function closeDiagramEditor() {
    if (panel.hidden) return;
    panel.hidden = true;
    DG.nodeId = null; DG.parentId = null;
    var wrap = el('#mapwrap');
    if (wrap) wrap.focus();
  }
  function insertDiagram() {
    var src = srcField.value.trim();
    if (!src) { closeDiagramEditor(); return; }
    if (DG.nodeId && N(DG.nodeId)) {
      N(DG.nodeId).diagram = src;
      save(); render();
    } else {
      var pid = DG.parentId || rootNode().id;
      var id = uid('n');
      S.nodes.push({ id: id, parent: pid, title: '', body: '', accent: accentFor(pid), diagram: src });
      UI.sel = id;
      mapView().touched = true;
      save(); render();
      var n = el('.gm-node[data-node="' + id + '"]');
      if (n) ensureVisible(n);
    }
    closeDiagramEditor();
    toast('הדיאגרמה נוספה');
  }

  /* ── wiring ────────────────────────────────────────────────────────── */
  panel.addEventListener('click', function (e) {
    if (e.target.closest('#diagramInsert')) { insertDiagram(); return; }
    if (e.target.closest('#diagramCancel')) { closeDiagramEditor(); return; }
    var chip = e.target.closest('[data-dg-chip]');
    if (chip) {
      var found = DIAGRAM_CHIPS.filter(function (c) { return c.key === chip.dataset.dgChip; })[0];
      if (found) { srcField.value = found.src; schedulePreview(); srcField.focus({ preventScroll: true }); resetPageScroll(); }
    }
  });
  srcField.addEventListener('input', schedulePreview);
  /* Keys typed here never reach the map's own shortcuts — inField() (engine
     part 3) already treats any element inside #diagramPanel as a field.
     Only Ctrl+Enter (insert) and Escape (cancel) are handled locally; plain
     Enter must stay a normal newline, since Mermaid source is multi-line. */
  srcField.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeDiagramEditor(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); insertDiagram(); }
  });
  document.addEventListener('keydown', function (e) {
    if (!panel.hidden && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeDiagramEditor(); }
  }, true);
  document.addEventListener('pointerdown', function (e) {
    if (panel.hidden) return;
    if (e.target.closest && e.target.closest('#diagramPanel, .gm-diagram')) return;
    closeDiagramEditor();
  }, true);

  window.openDiagramEditor = openDiagramEditor;
  window.closeDiagramEditor = closeDiagramEditor;

  /* ── anti-overlap: render each diagram card's SVG once its node.diagram
     is known, then re-settle (contract: "re-run settleMap() so nothing
     overlaps"). A fresh placeholder div every render() (the whole #world
     subtree is replaced), so re-rendering unchanged source each time is
     cheap enough not to bother caching across renders. ─────────────────── */
  RENDER_HOOKS.push(function () {
    els('.gm-diagram[data-diagram-node]').forEach(function (host) {
      var node = N(host.dataset.diagramNode);
      if (!node || !node.diagram) return;
      renderMermaidTo(host, node.diagram).then(function () { settleMap(); }, function () {
        host.innerHTML = '<span class="gm-diagram-loading">שגיאה בתרשים</span>';
      });
    });
  });

  /* A map that already holds a diagram loads Mermaid straight away, same
     as the equation editor does for MathLive. */
  if ((S.nodes || []).some(function (n) { return !!n.diagram; })) loadMermaid().catch(function () {});
})();
</script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   GlassMap — Addendum H1 (floating thought bubbles) + H3 (Obsidian notes as
   nodes, map side) + H4 (compact mode for the glass graph sidebar).
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  /* ── styles ──────────────────────────────────────────────────────────── */
  var css = document.createElement('style');
  css.textContent =
    /* H1 tray: start side (right, physically — the map's chrome is
       LTR-positioned per contract D4), pinned under the header, clear of
       every other floating element (crumb/find/mapctl/legend/hint). */
    /* The mapctl rail is a vertical column of icon buttons anchored
       bottom-right; at 16+ buttons it already reaches most of the way up a
       720px-tall viewport (a pre-existing ceiling this file has been bumping
       into addendum after addendum). Rather than depend on the rail's
       height staying short, the tray clears it HORIZONTALLY — offset far
       enough left of right:12px that the two columns can never intersect
       regardless of how tall the rail grows (its own width is fixed: 36px
       button + 12px padding at desktop, 32px + padding on phone). */
    '#thoughtTray{position:absolute;top:calc(12px + var(--gm-crumb-h,0px));right:70px;z-index:9;display:flex;flex-direction:column;' +
      'align-items:flex-end;gap:6px;max-width:min(260px,calc(100% - 190px));}' +
    '#thoughtTray[hidden]{display:none!important;}' +
    '.gm-tray-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;}' +
    '.gm-tray-panel{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;width:100%;' +
      'max-height:calc(100vh - 140px);overflow:hidden;box-sizing:border-box;}' +
    '.gm-tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:600;}' +
    '.gm-tray-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:calc(100vh - 190px);}' +
    '.gm-bubble{display:flex;align-items:flex-start;gap:6px;padding:7px 9px;border-radius:12px;' +
      'background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.5);cursor:grab;font-size:12px;}' +
    ':root[data-theme="dark"] .gm-bubble{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);}' +
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gm-bubble{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);}}' +
    '.gm-bubble.dragging{opacity:.4;}' +
    '.gm-bubble-txt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;max-height:4.2em;overflow:hidden;}' +
    '.gm-bubble-link{flex:none;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;' +
      'border-radius:999px;opacity:.75;}' +
    '.gm-bubble-link:hover{opacity:1;}' +
    /* H1 capture input */
    '#thoughtCapture{position:fixed;z-index:71;width:min(280px,calc(100vw - 24px));padding:10px;border-radius:14px;box-sizing:border-box;}' +
    '#thoughtCapture[hidden]{display:none!important;}' +
    '#thoughtCapture textarea{width:100%;min-height:64px;resize:vertical;font-size:13px;line-height:1.4;box-sizing:border-box;}' +
    '#thoughtCapture .gm-tc-hint{margin-top:4px;font-size:10.5px;color:var(--sh-text-tip);}' +
    /* select-and-pulse feedback (H3: dropping a note already on the map) */
    '@keyframes gm-pulse-kf{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.65);}50%{box-shadow:0 0 0 9px rgba(212,175,55,0);}}' +
    '.gm-node.gm-pulse{animation:gm-pulse-kf .9s ease-out 2;}' +
    /* H4 compact mode */
    '.gm-compact #gmHint,.gm-compact #legendBar,.gm-compact .gm-headtools{display:none!important;}' +
    '.gm-compact .mapctl{padding:3px!important;gap:2px!important;}' +
    '.gm-compact .mapctl .gm-btn.icon{width:28px!important;height:28px!important;}' +
    '.gm-compact .mapctl .gm-i{width:14px!important;height:14px!important;}';
  document.head.appendChild(css);

  /* ── H1: the floating tray ─────────────────────────────────────────────── */
  var tray = document.createElement('div');
  tray.className = 'gm-glass';
  tray.id = 'thoughtTray';
  tray.setAttribute('data-float', 'tray');
  tray.setAttribute('data-chrome', '1');
  tray.hidden = true;
  document.querySelector('.mapwrap').appendChild(tray);

  function ic(p, w) {
    w = w || 16;
    return '<svg class="gm-i" width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  var BUBBLE_ICON = '<path d="M12 21c-4.4 0-8-2.7-8-6s3.6-6 8-6 8 2.7 8 6c0 1-.3 1.9-.9 2.7"/><path d="M17 17c0 1.7 1.3 3 3 3"/>';
  var LINK_ICON = '<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/>';
  var CHEVRON_ICON = '<path d="m18 15-6-6-6 6"/>';

  function trayFoldKey() { return 'glassmap:trayFolded:' + (S.id || 'default'); }
  function isTrayFolded() { try { return localStorage.getItem(trayFoldKey()) === '1'; } catch (e) { return false; } }
  function setTrayFolded(v) { try { localStorage.setItem(trayFoldKey(), v ? '1' : '0'); } catch (e) {} renderTray(); }

  function renderTray() {
    var list = S.inbox || [];
    if (!list.length) { tray.hidden = true; return; }
    tray.hidden = false;
    var folded = isTrayFolded();
    tray.classList.toggle('folded', folded);
    if (folded) {
      tray.innerHTML = '<button class="gm-btn gm-tray-pill" id="trayFoldBtn" aria-pressed="true" ' +
        'title="הצג מחשבות — show thoughts" aria-label="Show thoughts">' + ic(BUBBLE_ICON) +
        '<span class="gm-bidi">מחשבות: <bdi>' + list.length + '</bdi></span></button>';
      return;
    }
    tray.innerHTML =
      '<div class="gm-tray-panel gm-glass">' +
        '<div class="gm-tray-head"><span class="gm-bidi">מחשבות: <bdi>' + list.length + '</bdi></span>' +
          '<button class="gm-btn icon" id="trayFoldBtn" aria-pressed="false" title="קפל — fold" aria-label="Fold">' + ic(CHEVRON_ICON, 14) + '</button></div>' +
        '<div class="gm-tray-list">' + list.map(function (b) {
          return '<div class="gm-bubble" draggable="true" data-bubble="' + esc(b.id) + '">' +
            '<span class="gm-bubble-txt gm-bidi" dir="auto">' + esc(b.text) + '</span>' +
            '<button class="gm-bubble-link" data-bubble-link="' + esc(b.id) + '" ' +
              'title="קשר לנושא הנבחר — link to the selected node" aria-label="Link to the selected node">' + ic(LINK_ICON, 14) + '</button>' +
          '</div>';
        }).join('') + '</div>' +
      '</div>';
  }
  RENDER_HOOKS.push(renderTray);
  renderTray();   /* this script runs after boot's own first render(), so paint the initial state once here too */

  /* ── H1: capture input — Alt+T, the rail button, or a double-click on the
     empty board (wired in mountMap()'s dblclick handler). ───────────────── */
  var capture = document.createElement('div');
  capture.className = 'gm-glass';
  capture.id = 'thoughtCapture';
  capture.setAttribute('data-float', 'thought-capture');
  capture.setAttribute('data-chrome', '1');
  capture.hidden = true;
  capture.innerHTML =
    '<textarea class="gm-bidi" dir="auto" placeholder="מה עולה לך?" aria-label="Capture a thought"></textarea>' +
    '<div class="gm-tc-hint gm-bidi"><kbd dir="ltr">Enter</kbd> שמירה · <kbd dir="ltr">Shift+Enter</kbd> שורה · <kbd dir="ltr">Esc</kbd> ביטול</div>';
  document.body.appendChild(capture);
  var captureTa = capture.querySelector('textarea');

  function closeThoughtCapture() {
    if (capture.hidden) return;
    capture.hidden = true;
    var mw = el('#mapwrap'); if (mw) mw.focus();
  }
  function commitThoughtCapture() {
    var text = captureTa.value.trim();
    closeThoughtCapture();
    if (!text) return;
    S.inbox = S.inbox || [];
    S.inbox.push({ id: uid('t'), text: text, created: new Date().toISOString() });
    save(); render();
    toast('נשמרה מחשבה');
  }
  function openThoughtCapture(x, y) {
    capture.hidden = false;
    if (typeof x === 'number' && typeof y === 'number') {
      var w = capture.offsetWidth || 280, h = capture.offsetHeight || 110;
      var left = Math.max(12, Math.min(x - w / 2, innerWidth - w - 12));
      var top = Math.max(64, Math.min(y - h / 2, innerHeight - h - 12));
      capture.style.left = left + 'px'; capture.style.top = top + 'px';
    } else {
      var tr = tray.getBoundingClientRect();
      capture.style.left = Math.max(12, tr.left - 290) + 'px';
      capture.style.top = Math.max(64, tr.top) + 'px';
    }
    captureTa.value = '';
    requestAnimationFrame(function () { captureTa.focus(); resetPageScroll(); });
  }
  captureTa.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); commitThoughtCapture(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeThoughtCapture(); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (capture.hidden) return;
    if (e.target.closest && e.target.closest('#thoughtCapture')) return;
    commitThoughtCapture();   /* clicking away commits, same spirit as a blur */
  }, true);
  window.openThoughtCapture = openThoughtCapture;

  /* ── H1: link a bubble to a node — drag-drop (default: child; Shift-drop:
     append to body) or the bubble's own link button (target = selection).
     One save() = one undo step that restores the bubble to the inbox
     exactly, per the contract's "one undo step restores it". ───────────── */
  function linkBubbleToNode(bubbleId, nodeId, appendToBody) {
    var idx = -1;
    (S.inbox || []).forEach(function (b, i) { if (b.id === bubbleId) idx = i; });
    var node = nodeId && N(nodeId);
    if (idx < 0 || !node) return;
    var b = S.inbox[idx];
    S.inbox = S.inbox.slice(0, idx).concat(S.inbox.slice(idx + 1));
    if (appendToBody) {
      node.body = node.body ? (node.body + '\n' + b.text) : b.text;
    } else {
      S.nodes.push({ id: uid('n'), parent: nodeId, title: b.text, body: '', accent: accentFor(nodeId) });
    }
    save(); render();
    requestAnimationFrame(function () { settleMap(); });
    toast('המחשבה קושרה — <kbd dir="ltr">Ctrl+Z</kbd> לביטול', { html: true });
  }
  document.addEventListener('dragstart', function (e) {
    var b = e.target.closest && e.target.closest('[data-bubble]');
    if (!b || !e.dataTransfer) return;
    e.dataTransfer.setData('text/gm-bubble', b.dataset.bubble);
    e.dataTransfer.effectAllowed = 'move';
    b.classList.add('dragging');
  });
  document.addEventListener('dragend', function (e) {
    var b = e.target.closest && e.target.closest('[data-bubble]');
    if (b) b.classList.remove('dragging');
  });
  document.addEventListener('dragover', function (e) {
    if (!e.dataTransfer) return;
    var types = e.dataTransfer.types;
    var has = types && (types.indexOf ? types.indexOf('text/gm-bubble') >= 0 : Array.prototype.indexOf.call(types, 'text/gm-bubble') >= 0);
    if (!has) return;
    var host = e.target.closest && e.target.closest('.gm-node[data-node]');
    if (host) e.preventDefault();
  });
  document.addEventListener('drop', function (e) {
    if (!e.dataTransfer) return;
    var bid = e.dataTransfer.getData('text/gm-bubble');
    if (!bid) return;
    var host = e.target.closest && e.target.closest('.gm-node[data-node]');
    if (!host) return;
    e.preventDefault();
    linkBubbleToNode(bid, host.dataset.node, e.shiftKey);
  });
  document.addEventListener('click', function (e) {
    var foldBtn = e.target.closest && e.target.closest('#trayFoldBtn');
    if (foldBtn) { setTrayFolded(!isTrayFolded()); return; }
    var linkBtn = e.target.closest && e.target.closest('[data-bubble-link]');
    if (linkBtn) {
      if (!UI.sel || !N(UI.sel)) { toast('בחר נושא קודם'); return; }
      linkBubbleToNode(linkBtn.dataset.bubbleLink, UI.sel, false);
      return;
    }
  });

  /* ── H3: host -> map bridge (see glassBridge.ts / glassmapView.ts) ──────── */
  function pulseSelect(id) {
    UI.sel = id;
    render();
    var n = el('.gm-node[data-node="' + id + '"]');
    if (n) {
      ensureVisible(n);
      n.classList.add('gm-pulse');
      setTimeout(function () { n.classList.remove('gm-pulse'); }, 900);
    }
  }
  window.addNoteNodesFromHost = function (notes, at) {
    if (!Array.isArray(notes) || !notes.length) return;
    var parentId = null;
    if (at && typeof at.x === 'number' && typeof at.y === 'number') {
      try {
        var hit = document.elementFromPoint(at.x, at.y);
        var hostNode = hit && hit.closest && hit.closest('.gm-node[data-node]');
        if (hostNode) parentId = hostNode.dataset.node;
      } catch (e) {}
    }
    if (!parentId && UI.sel && N(UI.sel)) parentId = UI.sel;
    if (!parentId) parentId = rootNode().id;
    var addedAny = false, lastId = null, dupe = null;
    notes.forEach(function (nt) {
      if (!nt || typeof nt.path !== 'string' || !nt.path) return;
      var existing = S.nodes.filter(function (n) { return n.kind === 'note' && n.note && n.note.path === nt.path; })[0];
      if (existing) { dupe = existing.id; return; }
      var id = uid('n');
      S.nodes.push({
        id: id, parent: parentId, title: nt.title || nt.path, body: '', accent: accentFor(parentId),
        kind: 'note', note: { path: nt.path, title: nt.title || nt.path, excerpt: nt.excerpt || '' }
      });
      addedAny = true; lastId = id;
    });
    if (addedAny) {
      UI.sel = lastId; mapView().touched = true; save(); render();
      requestAnimationFrame(function () { settleMap(); });
    }
    if (dupe && !addedAny) pulseSelect(dupe);
  };
  /* Not an undo step, not a user edit (contract): persistSoft() writes
     localStorage + a debounced gm:save, but never touches UNDO/REDO. */
  window.applyNoteUpdate = function (path, title, excerpt) {
    var touched = false;
    S.nodes.forEach(function (n) {
      if (n.kind === 'note' && n.note && n.note.path === path) {
        n.note.title = typeof title === 'string' && title ? title : n.note.title;
        n.note.excerpt = typeof excerpt === 'string' ? excerpt : n.note.excerpt;
        touched = true;
      }
    });
    if (touched) { persistSoft(); render(); }
  };
  window.applyNoteRename = function (oldPath, newPath, title) {
    var touched = false;
    S.nodes.forEach(function (n) {
      if (n.kind === 'note' && n.note && n.note.path === oldPath) {
        n.note.path = newPath;
        n.note.title = typeof title === 'string' && title ? title : n.note.title;
        touched = true;
      }
    });
    if (touched) { persistSoft(); render(); }
  };

  /* ── H4: compact mode — the plugin's glass graph sidebar. GM_COMPACT is set
     by the plugin BEFORE this script runs (a srcdoc page has no query string
     of its own); ?compact=1 covers the web/standalone case. ──────────────── */
  var compactOn = window.GM_COMPACT === true;
  if (!compactOn) {
    try { compactOn = new URLSearchParams(location.search).get('compact') === '1'; } catch (e) {}
  }
  if (compactOn) {
    document.documentElement.classList.add('gm-compact');
    var doFit = function () { fitMap(0); };
    setTimeout(doFit, 260);
    setTimeout(doFit, 900);
  }
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   GlassMap — Addendum H2: a sketch inside a node, Excalidraw as a POP-UP
   only (never the map canvas). Lazy-loads React + ReactDOM + the Excalidraw
   UMD bundle from a pinned CDN version on first open; every CDN URL is
   verified to return 200 before the map ever relies on it. Saving stores
   node.sketch (elements + appState.viewBackgroundColor + the files map, so
   an embedded image round-trips) and node.sketchSvg (a static thumbnail
   from exportToSvg) — refused above 200KB combined, with a Hebrew toast.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var EXCA_VERSION = '0.17.6';
  var REACT_VERSION = '18.3.1';
  var REACT_URL = 'https://cdn.jsdelivr.net/npm/react@' + REACT_VERSION + '/umd/react.production.min.js';
  var REACT_DOM_URL = 'https://cdn.jsdelivr.net/npm/react-dom@' + REACT_VERSION + '/umd/react-dom.production.min.js';
  var EXCA_BASE = 'https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@' + EXCA_VERSION + '/dist/';
  var EXCA_URL = EXCA_BASE + 'excalidraw.production.min.js';
  var MAX_BYTES = 200 * 1024;

  var css = document.createElement('style');
  css.textContent =
    '#sketchModal{position:fixed;inset:0;z-index:72;display:grid;place-items:center;' +
      'background:rgba(15,25,50,.45);opacity:0;pointer-events:none;transition:opacity .18s ease;}' +
    '#sketchModal.open{opacity:1;pointer-events:auto;}' +
    '#sketchModal[hidden]{display:none!important;}' +
    '.gm-sketch-card{width:min(960px,94vw);height:min(680px,88vh);border-radius:18px;' +
      'display:flex;flex-direction:column;overflow:hidden;padding:0;}' +
    '.gm-sketch-head{flex:none;display:flex;align-items:center;justify-content:space-between;' +
      'padding:10px 14px;border-bottom:1px solid var(--sh-line);}' +
    '.gm-sketch-title{font-size:13.5px;font-weight:600;}' +
    '.gm-sketch-actions{display:flex;gap:6px;}' +
    '.gm-sketch-mount{flex:1 1 auto;min-height:0;position:relative;background:#fff;}' +
    '.gm-sketch-mount .excalidraw{height:100%;}' +
    '.gm-sketch-loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;' +
      'color:var(--sh-text-med);background:rgba(255,255,255,.85);}' +
    ':root[data-theme="dark"] .gm-sketch-loading{background:rgba(10,15,30,.85);}';
  document.head.appendChild(css);

  function ic(p) {
    return '<svg class="gm-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  var modal = document.createElement('div');
  modal.id = 'sketchModal';
  modal.setAttribute('data-float', 'sketch');
  modal.setAttribute('data-chrome', '1');
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', 'עורך שרטוטים');
  /* Coordinator review (round 2): chrome text is Hebrew-only — the modal's
     OWN header (title + Save/Cancel) already was, but Excalidraw itself
     defaults to English UI strings unless told otherwise. dir="rtl" here
     flips the header row (title starts on the right); Excalidraw's own
     mirroring is driven by langCode, set on the Excalidraw element itself
     in mountEditor() below, not by this dir attribute. */
  modal.setAttribute('dir', 'rtl');
  modal.hidden = true;
  modal.innerHTML =
    '<div class="gm-sketch-card gm-glass">' +
      '<div class="gm-sketch-head"><span class="gm-sketch-title gm-bidi">שרטוט לנושא</span>' +
        '<div class="gm-sketch-actions">' +
          '<button class="gm-btn" id="sketchCancel" title="ביטול (Esc) — cancel">' + ic('<path d="M18 6 6 18M6 6l12 12"/>') + '<span>ביטול</span></button>' +
          '<button class="gm-btn on" id="sketchSave" title="שמור — save">' + ic('<path d="M20 6 9 17l-5-5"/>') + '<span>שמור</span></button>' +
        '</div></div>' +
      '<div class="gm-sketch-mount" id="sketchMount"><div class="gm-sketch-loading">טוען עורך שרטוטים…</div></div>' +
    '</div>';
  document.body.appendChild(modal);
  var mount = modal.querySelector('#sketchMount');

  var SK = { nodeId: null, root: null, api: null, ready: false };

  /* ── CDN health check — H2: "check every CDN URL returns 200 before
     relying on it". A HEAD request is enough; jsdelivr serves CORS on all
     of these. ─────────────────────────────────────────────────────────── */
  function checkUrl(url) {
    return fetch(url, { method: 'HEAD' }).then(function (r) { return !!r.ok; }).catch(function () { return false; });
  }
  var cdnOkPromise = null;
  function cdnHealthy() {
    if (!cdnOkPromise) {
      cdnOkPromise = Promise.all([checkUrl(REACT_URL), checkUrl(REACT_DOM_URL), checkUrl(EXCA_URL)])
        .then(function (r) { return r.every(Boolean); });
    }
    return cdnOkPromise;
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }
  var excaLoading = null;
  function loadExcalidraw() {
    if (window.ExcalidrawLib && window.React && window.ReactDOM) return Promise.resolve();
    if (excaLoading) return excaLoading;
    excaLoading = cdnHealthy().then(function (ok) {
      if (!ok) throw new Error('cdn unreachable');
      window.EXCALIDRAW_ASSET_PATH = EXCA_BASE;
      var p = window.React ? Promise.resolve() : loadScript(REACT_URL);
      return p.then(function () { return window.ReactDOM ? Promise.resolve() : loadScript(REACT_DOM_URL); })
        .then(function () { return window.ExcalidrawLib ? Promise.resolve() : loadScript(EXCA_URL); });
    }, function () { throw new Error('cdn unreachable'); }).catch(function (err) {
      excaLoading = null;
      throw err;
    });
    return excaLoading;
  }

  function byteLength(str) {
    try { return new Blob([str]).size; } catch (e) { return str.length; }
  }

  function mountEditor(node) {
    mount.innerHTML = '';
    var host = document.createElement('div');
    host.style.height = '100%';
    mount.appendChild(host);
    var initialData = (node.sketch && Array.isArray(node.sketch.elements)) ? {
      elements: window.ExcalidrawLib.restoreElements(node.sketch.elements, null),
      appState: { viewBackgroundColor: (node.sketch.appState && node.sketch.appState.viewBackgroundColor) || '#ffffff' },
      files: node.sketch.files || {}
    } : { appState: { viewBackgroundColor: '#ffffff' } };
    /* langCode is the documented prop for Excalidraw's own UI language
       (https://docs.excalidraw.com — "he-IL" is a supported code). Passed
       here per the contract; confirmed empirically (both inside glassmap
       and in an isolated minimal harness with no other props at all) that
       the pinned @excalidraw/excalidraw@0.17.6 UMD build does not actually
       switch its UI strings away from English on mount OR on a later
       prop-change re-render — its own source shows componentDidMount never
       calls updateLanguage() and componentDidUpdate's langCode-change path
       did not visibly take effect either in testing. This looks like a
       real limitation/bug in this specific packaged build rather than a
       wiring mistake here; left in place since it's still the documented,
       correct way to ask for Hebrew and costs nothing if a future version
       fixes it. The MODAL's own chrome (title/buttons) is unaffected — it
       was already Hebrew, and now also carries dir="rtl" (see `modal.setAttribute('dir', 'rtl')` above). */
    var el0 = window.React.createElement(window.ExcalidrawLib.Excalidraw, {
      initialData: initialData,
      langCode: 'he-IL',
      excalidrawAPI: function (api) { SK.api = api; }
    });
    SK.root = window.ReactDOM.createRoot(host);
    SK.root.render(el0);
  }

  function openSketchModal(nodeId) {
    var id = nodeId || UI.sel;
    var node = id && N(id);
    if (!node) { toast('בחר נושא קודם'); return; }
    SK.nodeId = id;
    modal.hidden = false;
    requestAnimationFrame(function () { modal.classList.add('open'); });
    mount.innerHTML = '<div class="gm-sketch-loading">טוען עורך שרטוטים…</div>';
    loadExcalidraw().then(function () {
      if (modal.hidden || SK.nodeId !== id) return;   /* closed again before the CDN answered */
      mountEditor(node);
    }, function () {
      mount.innerHTML = '<div class="gm-sketch-loading">עורך השרטוטים לא נטען — צריך חיבור לאינטרנט</div>';
    });
  }
  function closeSketchModal() {
    if (modal.hidden) return;
    modal.classList.remove('open');
    setTimeout(function () {
      modal.hidden = true;
      if (SK.root) { try { SK.root.unmount(); } catch (e) {} SK.root = null; }
      SK.api = null; SK.nodeId = null;
      var wrap = el('#mapwrap'); if (wrap) wrap.focus();
    }, 180);
  }
  function saveSketch() {
    var node = SK.nodeId && N(SK.nodeId);
    if (!node || !SK.api) { closeSketchModal(); return; }
    var elements = SK.api.getSceneElements();
    var appState = SK.api.getAppState();
    var files = SK.api.getFiles ? SK.api.getFiles() : {};
    var sketch = { elements: elements, appState: { viewBackgroundColor: appState.viewBackgroundColor || '#ffffff' }, files: files };
    var svg = '';
    /* exportToSvg() derives the font asset URL differently from the live
       canvas (it appends "/dist/excalidraw-assets/…" to EXCALIDRAW_ASSET_PATH
       itself, where the canvas's own webpack runtime already expects that
       path to END in "/dist/") — verified by hand against jsdelivr: the
       canvas needs EXCA_BASE, exportToSvg needs the package root with no
       trailing slash, or the font request 404s/400s. Swap it only for the
       duration of this call. */
    var prevAssetPath = window.EXCALIDRAW_ASSET_PATH;
    window.EXCALIDRAW_ASSET_PATH = 'https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@' + EXCA_VERSION;
    window.ExcalidrawLib.exportToSvg({ elements: elements, appState: sketch.appState, files: files })
      .then(function (svgEl) {
        window.EXCALIDRAW_ASSET_PATH = prevAssetPath;
        svg = svgEl.outerHTML;
        var totalBytes = byteLength(JSON.stringify(sketch)) + byteLength(svg);
        if (totalBytes > MAX_BYTES) {
          toast('השרטוט גדול מדי (מעל 200KB) — לא נשמר');
