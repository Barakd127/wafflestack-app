<meta charset="UTF-8">
<title>GlassMap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* ═════════════════════════════════════════════════════════════════════════
   GlassMap — tokens
   Copied verbatim (values only) from wafflestack-glassmap/src/index.css
   lines 50-100 (--sh-* light + html.dark) plus the .ws-glass-card recipe, so
   this file never depends on the app's own stylesheet — it must stand alone
   inside an iframe, inside Obsidian's srcdoc bridge, and opened from disk.
   Category accents + gold + navy ink are pasted from the contract's "Glass
   look" section, not re-derived.
   ═════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --sh-page-bg: linear-gradient(35.22deg, #FFFFFF -9.85%, #D8E7FA 49.05%, #3351CA 136%);
  --sh-glass-card: linear-gradient(180deg, rgba(255,255,255,0.45) 54.33%, rgba(255,255,255,0.15) 100%);
  --sh-card-shadow: 0px 15px 30px rgba(31,41,55,0.25);
  --sh-btn-color: #122460;
  --sh-text-dark: #1F3E6C;
  --sh-text-med: #254A9F;
  --sh-text-light: #7F9BD9;
  --sh-text-tip: #465CA5;
  --sh-panel-bg: rgba(255,255,255,0.55);
  --sh-panel-border: rgba(255,255,255,0.6);
  --sh-line: rgba(31,62,108,0.16);
  /* category accents — cycled by top-level branch, contract §Glass look */
  --gm-teal:#0E9AA7; --gm-purple:#9B5DE5; --gm-green:#2E9E6B; --gm-coral:#E76F51;
  --gm-gold:#D4AF37; --gm-navy:#1F3E6C;
  --gm-danger:#C0392B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sh-page-bg: linear-gradient(35.22deg, #0a0a16 -9.85%, #111128 49.05%, #181840 136%);
    --sh-glass-card: linear-gradient(180deg, rgba(255,255,255,0.07) 54.33%, rgba(255,255,255,0.03) 100%);
    --sh-card-shadow: 0px 15px 30px rgba(0,0,0,0.5);
    --sh-btn-color: #4ECDC4;
    --sh-text-dark: #e2e8f0;
    --sh-text-med: #a5b4fc;
    --sh-text-light: #94a3b8;
    --sh-text-tip: #64748b;
    --sh-panel-bg: rgba(15,15,30,0.55);
    --sh-panel-border: rgba(255,255,255,0.12);
    --sh-line: rgba(255,255,255,0.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sh-page-bg: linear-gradient(35.22deg, #0a0a16 -9.85%, #111128 49.05%, #181840 136%);
  --sh-glass-card: linear-gradient(180deg, rgba(255,255,255,0.07) 54.33%, rgba(255,255,255,0.03) 100%);
  --sh-card-shadow: 0px 15px 30px rgba(0,0,0,0.5);
  --sh-btn-color: #4ECDC4;
  --sh-text-dark: #e2e8f0;
  --sh-text-med: #a5b4fc;
  --sh-text-light: #94a3b8;
  --sh-text-tip: #64748b;
  --sh-panel-bg: rgba(15,15,30,0.55);
  --sh-panel-border: rgba(255,255,255,0.12);
  --sh-line: rgba(255,255,255,0.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--sh-page-bg);
  color:var(--sh-text-dark);
  font-family:'Heebo',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif; /* degrades clean if the CDN link is stripped (Obsidian sync-canvas) */
  font-size:14px; line-height:1.4;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
input,textarea{background:none;border:0;outline:none;}
::placeholder{color:var(--sh-text-light);}
:focus-visible{outline:2px solid var(--gm-gold);outline-offset:2px;border-radius:4px;}
*{scrollbar-width:thin;scrollbar-color:rgba(37,74,159,.35) transparent;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(37,74,159,.35);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
.tnum{font-variant-numeric:tabular-nums;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
/* Hebrew / mixed titles are the norm here, never scramble them inside LTR
   chrome — same fix WaffleTask needed (contract §Glass look). */
.gm-bidi{unicode-bidi:plaintext;text-align:start;}

/* ── the glass card recipe ─────────────────────────────────────────────────
   Pasted from .ws-glass-card in src/index.css: blur 20 / saturate 160%, the
   --sh-glass-card gradient, 1px white borders with a darker bottom/right
   edge, two inset highlights. Kept as one reusable class so every card in
   this file (nodes, header, mapctl, sheets, overlays, toasts) is visually
   the same material. */
.gm-glass{
  position:relative;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  background:var(--sh-glass-card);
  border:1px solid rgba(255,255,255,.55);
  border-bottom-color:rgba(255,255,255,.18);
  border-right-color:rgba(255,255,255,.18);
  box-shadow:var(--sh-card-shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(31,62,108,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gm-glass{
  border-color:rgba(255,255,255,.14); border-bottom-color:rgba(0,0,0,.2); border-right-color:rgba(0,0,0,.2);
  box-shadow:var(--sh-card-shadow), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.2);
} }
:root[data-theme="dark"] .gm-glass{
  border-color:rgba(255,255,255,.14); border-bottom-color:rgba(0,0,0,.2); border-right-color:rgba(0,0,0,.2);
  box-shadow:var(--sh-card-shadow), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.2);
}

/* ── shell ───────────────────────────────────────────────────────────────── */
.gm-app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
.gm-head{flex:none;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-radius:0 0 14px 14px;}
.gm-head[hidden]{display:none;}
.gm-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;}
.gm-brand .gm-mark{flex:none;font-size:18px;}
.gm-doctitle{flex:1 1 auto;min-width:0;font-weight:600;font-size:16px;color:var(--sh-text-dark);
  padding:3px 6px;border-radius:6px;cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gm-doctitle[contenteditable="true"]{outline:2px solid var(--gm-gold);outline-offset:2px;white-space:normal;}
.gm-headtools{display:flex;align-items:center;gap:6px;flex:none;position:relative;}

.gm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--sh-text-dark);background:rgba(255,255,255,.28);border:1px solid var(--sh-panel-border);
  transition:background .12s ease,transform .12s ease;white-space:nowrap;}
.gm-btn:hover{background:rgba(255,255,255,.42);}
.gm-btn:active{transform:scale(.96);}
.gm-btn.icon{width:30px;padding:0;font-size:15px;}
.gm-btn[aria-pressed="true"],.gm-btn.on{background:var(--sh-btn-color);color:var(--gm-gold);border-color:transparent;}
.gm-btn.danger{color:var(--gm-danger);}

.gm-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:31;min-width:190px;
  border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;}
.gm-menu[hidden]{display:none;}
.gm-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-size:13px;color:var(--sh-text-dark);}
.gm-menu button:hover{background:rgba(255,255,255,.35);}
.gm-menu hr{border:0;border-top:1px solid var(--sh-line);margin:4px 2px;width:100%;}

.gm-body{flex:1 1 auto;min-height:0;position:relative;}

/* ── the plane ───────────────────────────────────────────────────────────── */
.mapwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:var(--sh-page-bg);
  /* nodes are divs, so without this a click-drag rubber-bands a text
     selection across the whole plane — WaffleTask hit this first. */
  user-select:none;-webkit-user-select:none;}
.mapwrap .gm-ttl[contenteditable="true"],.mapwrap .gm-body-ta{user-select:text;-webkit-user-select:text;}
.mapwrap.panning{cursor:grabbing;}
.mapwrap.relmode{cursor:crosshair;}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;}
.gm-wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;
  transition:opacity .18s ease;}
.gm-wires path.tree{fill:none;stroke-linecap:round;}
.gm-wires path.rel{fill:none;stroke-linecap:round;stroke-dasharray:2 6;}
/* cards layer: tree wires + relations hidden by default (contract §Layers);
   a hovered node ghosts just its own edges back in via .gm-peek (JS-toggled,
   see mountMap — two separate DOM subtrees can't do this with CSS alone). */
.mapwrap[data-layer="cards"] .gm-wires{opacity:0;}
.mapwrap[data-layer="cards"] .gm-wires path.gm-peek{opacity:.35 !important;}

.gm-node{position:absolute;transform:translate(-50%,-50%);min-width:120px;max-width:260px;
  padding:10px 14px;border-radius:16px;cursor:default;
  transition:opacity .18s ease,box-shadow .14s ease;}
.gm-node.grabbed{z-index:6;cursor:grabbing;}
.gm-node .gm-ttl{font-size:14px;line-height:1.3;color:var(--sh-text-dark);font-weight:500;
  overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;}
.gm-node .gm-ttl[contenteditable="true"]{outline:2px solid var(--gm-gold);outline-offset:3px;border-radius:4px;
  -webkit-line-clamp:unset;overflow:visible;cursor:text;}
/* the 4px accent stripe on the card's start edge (contract: cards layer, but
   kept visible in links layer too — it costs nothing and reads as the same
   branch colour the wire already carries) */
.gm-node .gm-stripe{position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;background:var(--acc,var(--gm-teal));}
.gm-node.root{min-width:180px;max-width:320px;padding:16px 20px;border-radius:20px;
  background:var(--sh-btn-color) !important;}
/* P2 fix: --sh-btn-color is teal (#4ECDC4) in dark mode (it's meant for the
   little "pressed" toggle buttons there) — using it for the root chip's
   background too made the root card render teal-on-teal in dark, instead of
   the navy-with-gold-text look the root chip is supposed to have in both
   themes. Give the root card its own dark-mode background instead of
   reusing that variable. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gm-node.root{
  background:linear-gradient(160deg,#1a2080,#0f1245) !important;
} }
:root[data-theme="dark"] .gm-node.root{
  background:linear-gradient(160deg,#1a2080,#0f1245) !important;
}
/* P1 fix: at max-width:320 and 26px bold, a realistic bilingual root title
   (the seeded default itself: "נושא מרכזי — Central topic") still needed a
   3rd line and was getting clipped with an ellipsis after 2 — bump the
   clamp so the card wraps the whole title instead of cutting it off. */
.gm-node.root .gm-ttl{font-size:26px;font-weight:700;color:var(--gm-gold);-webkit-line-clamp:3;}
.gm-node.root .gm-stripe{display:none;}
.gm-node .gm-meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--sh-text-med);}
.gm-node .gm-note-mark{opacity:.85;}
.gm-node .gm-badge{display:inline-grid;place-items:center;min-width:16px;height:15px;padding:0 4px;
  border-radius:99px;background:rgba(31,62,108,.16);font-size:9.5px;color:var(--sh-text-dark);}
.gm-node.root .gm-badge{background:rgba(255,255,255,.18);color:var(--gm-gold);}
/* depth-dot row — cards layer only, so hierarchy still reads with the wires
   off (contract §Layers) */
.gm-depthdots{display:none;gap:3px;margin-top:5px;}
.mapwrap[data-layer="cards"] .gm-depthdots{display:flex;}
.gm-depthdots i{width:5px;height:5px;border-radius:50%;background:var(--acc,var(--gm-teal));opacity:.55;}

/* ── A1 semantic zoom (level of detail) ───────────────────────────────────
   Three altitudes derived from view.z and stamped on #mapwrap by applyMap()
   (contract Addendum A1): lod-far (z<0.45) / lod-mid (0.45-0.9) / lod-near
   (>=0.9). Everything here is opacity/transform only — never a size change
   to the box a node is laid out at (its left/top anchor from settleMap
   never moves), so switching class is a fade, not a reflow. --gm-z is set
   alongside the class by the same applyMap() call, so the root/depth-1
   counter-scale below tracks the camera continuously, not just at the
   three thresholds. */
.gm-node,.gm-ttl,.gm-note-mark,.gm-depthdots,.gm-rellabel{transition:opacity .18s ease,transform .18s ease,box-shadow .14s ease;}
.mapwrap.lod-far .gm-node.root .gm-ttl{
  font-size:calc(26px * min(4.55, calc(1 / var(--gm-z, 1))));
}
.mapwrap.lod-far .gm-node[data-depth="1"] .gm-ttl{
  font-size:calc(14px * min(4.55, calc(1 / var(--gm-z, 1))));
}
/* depth ≥ 2 collapse to a small dot-pill: no text, just the accent stripe,
   scaled down around the node's own centre (its translate(-50%,-50%)
   anchor point is untouched, so it never drifts). */
.mapwrap.lod-far .gm-node:not(.root):not([data-depth="0"]):not([data-depth="1"]){
  transform:translate(-50%,-50%) scale(.14);
  border-radius:50%;
}
.mapwrap.lod-far .gm-node:not(.root):not([data-depth="1"]) .gm-ttl,
.mapwrap.lod-far .gm-node:not(.root):not([data-depth="1"]) .gm-meta,
.mapwrap.lod-far .gm-node:not(.root):not([data-depth="1"]) .gm-depthdots{
  opacity:0;pointer-events:none;
}
.mapwrap.lod-far .gm-rellabel{opacity:0;pointer-events:none;}      /* far: relation LINES stay (SVG), labels hide */
.mapwrap.lod-mid .gm-node .gm-note-mark{opacity:0;pointer-events:none;}  /* mid: titles only, no ✎ body marker */
.mapwrap.lod-near .gm-depthdots{display:flex;}                     /* near: "everything" — depth dots even in links layer */

/* selection / marks / hazing — same visual language as WaffleTask's map */
.gm-node.sel{box-shadow:var(--sh-card-shadow),0 0 0 3px var(--gm-gold),0 0 18px rgba(212,175,55,.45);}
.gm-node.marked{box-shadow:var(--sh-card-shadow),0 0 0 2px var(--gm-gold);}
.gm-node.marked.sel{box-shadow:var(--sh-card-shadow),0 0 0 2px var(--gm-gold),0 0 0 4.5px rgba(212,175,55,.5);}
.gm-node.relsrc{box-shadow:var(--sh-card-shadow),0 0 0 3px var(--sh-text-med),0 0 16px rgba(37,74,159,.5);}
.hazed{filter:blur(2.8px) saturate(.45);opacity:.42;box-shadow:none !important;
  transition:filter .25s ease,opacity .25s ease;}
.gm-node:not(.hazed){transition:filter .25s ease,opacity .25s ease,box-shadow .14s ease,transform .18s ease;}
@media (prefers-reduced-motion:reduce){ .hazed{transition:none;} }
.gm-node.blocked{box-shadow:var(--sh-card-shadow),0 0 0 3px var(--gm-danger);}
.gm-node.focusing{animation:gmfocusring .75s ease-out;}
@keyframes gmfocusring{
  0%{box-shadow:var(--sh-card-shadow),0 0 0 0 var(--gm-gold);}
  30%{box-shadow:var(--sh-card-shadow),0 0 0 4px var(--gm-gold);}
  100%{box-shadow:var(--sh-card-shadow),0 0 0 0 rgba(212,175,55,0);}}

/* the selected node offers the thing you want next: a child under it */
.addkid{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;line-height:1;color:#1b1f24;background:var(--gm-gold);
  box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:3;}
.addkid:hover{filter:brightness(1.12);}

.marquee{position:absolute;z-index:9;pointer-events:none;border:1.5px dashed var(--gm-gold);
  background:rgba(212,175,55,.1);border-radius:4px;}

/* relation label pill — sits mid-way on the dashed arrow, editable */
.gm-rellabel{position:absolute;transform:translate(-50%,-50%);z-index:5;
  display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;
  font-size:11px;color:var(--sh-text-dark);cursor:text;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
.mapwrap[data-layer="cards"] .gm-rellabel{display:none;}
.gm-rellabel[contenteditable="true"]{outline:2px solid var(--gm-gold);outline-offset:2px;overflow:visible;white-space:normal;}
.gm-rellabel .gm-relx{opacity:0;flex:none;font-size:10px;color:var(--gm-danger);}
.gm-rellabel:hover .gm-relx{opacity:1;}

/* gentle bars showing where you are on the plane; drag them to move —
   content-bounds only (contract / waffletask-board memory: "folding the
   current view into the span" once threw the board thousands of px/drag) */
.mbar{position:absolute;z-index:6;background:rgba(31,62,108,.10);border-radius:99px;
  opacity:0;transition:opacity .25s ease;}
.mapwrap:hover .mbar,.mbar.live{opacity:1;}
.mbar i{position:absolute;display:block;background:var(--sh-text-med);border-radius:99px;opacity:.5;}
.mbar i:hover,.mbar.live i{opacity:.85;}
.mbar.h{left:10px;right:64px;bottom:6px;height:7px;}
.mbar.h i{top:0;height:100%;min-width:26px;cursor:grab;}
.mbar.v{top:10px;bottom:64px;right:6px;width:7px;}
.mbar.v i{left:0;width:100%;min-height:26px;cursor:grab;}
@media (max-width:760px){ .mbar{display:none;} }

/* ── map controls pill ──────────────────────────────────────────────────── */
.mapctl{position:absolute;right:12px;bottom:12px;z-index:7;display:flex;flex-direction:column;gap:6px;
  padding:6px;border-radius:14px;}
.gm-find{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;min-width:220px;}
.gm-find[hidden]{display:none;}
.gm-find input{flex:1 1 auto;min-width:0;font-size:13px;}
.gm-find .gm-findcount{font-size:11px;color:var(--sh-text-med);white-space:nowrap;}
.gm-hint{position:absolute;left:13px;bottom:13px;z-index:7;font-size:11px;color:var(--sh-text-tip);
  pointer-events:none;user-select:none;max-width:60%;}
@media (max-width:760px){ .gm-hint{display:none;} }

/* ── A4 node kinds ─────────────────────────────────────────────────────────
   node.kind cycles concept→known→bridge→gap→question via K / Shift+K.
   Visuals apply at mid+near only (contract Addendum A4) — at lod-far every
   non-root/depth-1 node is already a textless dot-pill, so kind tinting
   there would just recolour a dot nobody reads as a "kind" yet. */
.gm-node .gm-glyph{font-size:12px;opacity:.7;margin-inline-end:4px;}
.mapwrap:not(.lod-far) .gm-node.gm-kind-known{background-image:linear-gradient(rgba(46,158,107,.16),rgba(46,158,107,.16)),var(--sh-glass-card);}
.mapwrap:not(.lod-far) .gm-node.gm-kind-known .gm-stripe{background:#2E9E6B;}
.mapwrap:not(.lod-far) .gm-node.gm-kind-bridge{border-radius:999px;background-image:linear-gradient(rgba(212,175,55,.18),rgba(212,175,55,.18)),var(--sh-glass-card);}
.mapwrap:not(.lod-far) .gm-node.gm-kind-gap{border-color:rgba(201,42,42,.55);}
.mapwrap:not(.lod-far) .gm-node.gm-kind-question{background-image:linear-gradient(rgba(155,93,229,.14),rgba(155,93,229,.14)),var(--sh-glass-card);}
.mapwrap:not(.lod-far) .gm-node.gm-kind-question .gm-stripe{background:var(--gm-purple);}

/* ── A5 anchor chip ("in your world this is…") ────────────────────────────
   node.bridge; shown inline only at lod-near, otherwise folded into the
   node's own native title= tooltip so it still reads on hover at any zoom
   (contract: "Shown only at lod-near; on hover at any zoom as a tooltip"). */
.gm-bridge{margin-top:4px;display:none;align-items:center;gap:4px;max-width:100%;
  padding:2px 8px;border-radius:999px;background:rgba(212,175,55,.22);
  color:var(--gm-navy);font-size:10.5px;font-weight:600;cursor:text;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mapwrap.lod-near .gm-bridge{display:inline-flex;}
.gm-bridge.force{display:inline-flex !important;}
.gm-bridge .gm-bridge-txt[contenteditable="true"]{outline:2px solid var(--gm-gold);white-space:normal;overflow:visible;}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gm-bridge{color:#3a2f06;} }
:root[data-theme="dark"] .gm-bridge{color:#3a2f06;}

/* ── A7 hub halo — a node with ≥2 cross-links, links layer only ──────────
   A ::after glow rather than another box-shadow layer, so it never has to
   be combined with .sel/.marked's own box-shadow in the CSS cascade. */
.gm-node.hub::after{content:"";position:absolute;inset:-4px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 4px rgba(212,175,55,.18),0 0 24px rgba(212,175,55,.28);}
.mapwrap[data-layer="cards"] .gm-node.hub::after{display:none;}

/* ── A9 branch legend + solo ──────────────────────────────────────────────
   Bottom-start glass strip, one chip per top-level branch (contract
   Addendum A9); draggable (JS sets left/top and clears the default
   inset/bottom once moved), position remembered in S.legendPos. */
.gm-legend{position:absolute;left:12px;bottom:56px;z-index:7;display:flex;flex-wrap:wrap;
  gap:4px;max-width:min(72%,540px);padding:6px;border-radius:14px;cursor:grab;}
.gm-legend[hidden]{display:none;}
.gm-legend-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;

<script>
/* Set the page's own light/dark before first paint. Order of authority:
   an explicit choice saved for THIS map id wins; else ?theme= at boot; else
   the OS. A `ws-theme` push from the host (once the app mounts) overrides
   the rendered theme live but never touches what's saved here — see
   `resolveTheme()` in the main engine, this is only the pre-paint guess. */
(function () {
  var r = document.documentElement;
  function param(name) {
    try { return new URL(location.href).searchParams.get(name); } catch (e) { return null; }
  }
  var mapId = param('map') || 'default';
  var saved = null;
  try {
    var raw = localStorage.getItem('glassmap:' + mapId);
    if (raw) saved = JSON.parse(raw).theme;
  } catch (e) {}
  var mode = (saved === 'light' || saved === 'dark') ? saved : null;
  if (!mode) {
    var q = param('theme');
    if (q === 'light' || q === 'dark') mode = q;
  }
  if (mode) r.setAttribute('data-theme', mode);
})();
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════

   Ported from C:\Users\Dell\waffletask\index.html (CSS 5-604, script
   1284-2764) per the contract at specs/glassmap.md. WaffleTask's map had
   TWO node kinds (hub / project / task); GlassMap's data model collapses
   that to ONE kind — every node is `{id, parent, title, body, mx, my,
   pinned, collapsed, accent}` and exactly one node (parent === null) is the
   root. Function names, the settling/wobble/wedge algorithms and the
   comments explaining past bugs are kept as close to the original as the
   new single-tree model allows; anything that only made sense for
   projects/tasks/board/timer/gems/1·2·3/done/today has been stripped.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── constants ───────────────────────────────────────────────────────── */
var ACCENTS = ['--gm-teal', '--gm-purple', '--gm-green', '--gm-coral'];   /* cycled by top-level branch */
var LS_PREFIX = 'glassmap:';

   and is never actually stored on the node (absent === concept) so an
   un-kinded node round-trips through JSON/undo with no extra field. */
var KINDS = ['concept', 'known', 'bridge', 'gap', 'question'];
var KIND_GLYPH = { known: '✓', bridge: '⇄', gap: '◆', question: '?' };

function qparam(name) {
  try { return new URL(location.href).searchParams.get(name); } catch (e) { return null; }
}
var MAP_ID = qparam('map') || 'default';
var LS_KEY = LS_PREFIX + MAP_ID;
var EMBED = qparam('embed') === '1';

/* ── small pieces ────────────────────────────────────────────────────── */
function uid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
function esc(s) {

function seed(id, title) {

  return {
    v: 1, id: id || 'default', title: title || 'GlassMap',
    layer: 'links', theme: 'auto',
    nodes: [{ id: rid, parent: null, title: 'נושא מרכזי — Central topic', body: '' }],
    links: [],
    view: { x: 0, y: 0, z: 1, fit: false, touched: false },
    edits: 0, updatedAt: Date.now()

/* Defensive against a hand-edited or partially-imported file — same spirit

   would make the tree inconsistent, never throw. */
function normalise(x) {
  if (!x || typeof x !== 'object' || !Array.isArray(x.nodes) || !x.nodes.length) return null;

     wiping an unrelated node/subtree the user never selected. Keep the

  if (!x.view || typeof x.view !== 'object') x.view = { x: 0, y: 0, z: 1, fit: false, touched: false };

  x.view.z = (+x.view.z) || 1; x.view.fit = !!x.view.fit; x.view.touched = !!x.view.touched;
  var ids = {};
  x.nodes.forEach(function (n) { ids[n.id] = 1; });
  x.nodes.forEach(function (n) {
    if (typeof n.title !== 'string') n.title = '';
    if (typeof n.body !== 'string') n.body = '';
    n.collapsed = !!n.collapsed;
    if (!isFinite(n.mx) || !isFinite(n.my)) { delete n.mx; delete n.my; } else { n.pinned = true; }
    if (n.parent != null && (n.parent === n.id || !ids[n.parent])) n.parent = null; /* only the true root may have null */
    /* A4 / A5: validate kind + bridge on the way in (hand-edited JSON, an

       a dead string the UI can't cycle back to. */
    if (n.kind != null && (KINDS.indexOf(n.kind) < 0 || n.kind === 'concept')) delete n.kind;

    x.legendPos = { x: x.legendPos.x, y: x.legendPos.y };
  } else { delete x.legendPos; }
  /* exactly one null-parent node survives; if normalising a bad import left
     more than one orphaned, the first found stays root and the rest are
     reattached under it rather than silently vanishing */
  var trueRoot = x.nodes.filter(function (n) { return n.parent == null; })[0];
  x.nodes.forEach(function (n) { if (n !== trueRoot && n.parent == null) n.parent = trueRoot.id; });

  x.nodes.forEach(function (n) {

    LAST_SYNCED_UPDATED_AT = S.updatedAt;
  } catch (e) {
    if (Date.now() - QUOTA_WARN_AT > 4000) {
      QUOTA_WARN_AT = Date.now();
      toast('שגיאה בשמירה — save error: storage quota is full, this change was not saved');
    }
  }
}

/* ── live state ──────────────────────────────────────────────────────── */
var S = readLocal() || seed(MAP_ID);
LAST_SYNCED_UPDATED_AT = S.updatedAt;
var UI = {
  sel: null,             /* selected node id, or null */
  marks: {},             /* multi-select, id -> 1 (contract: Shift+arrows / A / Ctrl+A) */
  lens: false,           /* the focus lens (mapctl ◉) */
  relFrom: null,         /* pending Ctrl+L relation source id */
  find: '',              /* live find text */
  drafts: {},
  radar: false,          /* A6: link radar toggle (R) */
  radarExpanded: [],     /* A6: collapsed ancestors radar force-opened, restored on off */
  soloBranch: null,      /* A9: top-level branch id currently soloed (legend / 1-9) */
  editingBridge: null,   /* A5: node id whose anchor chip is mid-edit (forces it visible off lod-near) */
  switcher: null         /* A10: {q, idx, results} while the quick switcher is open, else null */
};
var HOST_DARK = null;    /* set by an inbound {type:'ws-theme'} push; null = "no host opinion yet" */

/* ── dogfood/test hook — exposes live state + UI to the verification
   harness (Playwright) via page.evaluate(); read-only accessors so tests
   can assert without poking at module internals directly. */
window.GM = {
  S: function () { return S; }, UI: function () { return UI; },
  /* Round-2a addition (Addendum A1): GM.S().view is the live object, so a
     test can mutate its z directly to force an LOD tier and then call this
     to make applyMap() (the one place the lod-* class is ever set) pick it
     up — mirrors how a real zoom always runs through applyMap(). A real
     camera command always cancels whatever tween was still running first
     (animateMap/zoomAt both call cancelMapAnim() before moving) — without
     the same here, a tween still in flight from an earlier action (e.g. an
     ensureVisible glide right after growing a node) would win the very next
     animation frame and silently overwrite the test's direct z write. */
  applyMap: function () { cancelMapAnim(); applyMap(); }
};

/* ── persistence ─────────────────────────────────────────────────────────
   Two save paths, on purpose:
   - save() is the WaffleTask-style undo-tracked path for real edits (a
     node's title/body, the tree shape, a relation) — it pushes UNDO,
     bumps S.edits, and persists.
   - persistSoft() just writes localStorage (view/layer/theme changes):
     the contract asks these to survive a reload ("Reload persists …
     including layer and view", test 5) but they aren't "edits" and
     shouldn't fill up the undo stack with camera pans. */

var UNDO_CAP = 80;

function postToHost(type, data) {
  if (window.parent === window) return;                  /* not embedded — nothing listening */
  try { window.parent.postMessage({ type: type, data: data }, '*'); } catch (e) {}
}

    var coalesce = opts.coalesce && lastCoal && (now - lastSaveAt) < 1500;
    if (!coalesce) {
      UNDO.push(snapPrev);
      if (UNDO.length > UNDO_CAP) UNDO.shift();
      REDO.length = 0;
    }
    lastCoal = !!opts.coalesce;
  }
  lastSaveAt = now;
  S.edits = (+S.edits || 0) + 1;
  S.updatedAt = now;

  postToHost('gm:save', S);
}
var persistTimer = null;
function persistSoft() {
  writeLocal();

  persistTimer = setTimeout(function () { postToHost('gm:save', S); }, 400);
}
function applyState(json) {
  var next = normalise(JSON.parse(json));
  if (!next) return false;
  S = next;
  snapPrev = json;
  if (UI.sel && !N(UI.sel)) UI.sel = null;
  Object.keys(UI.marks).forEach(function (id) { if (!N(id)) delete UI.marks[id]; });
  /* E5: an undo/redo just replaced S wholesale — a node radar is holding
     open (in UI.radarExpanded) may have had its OWN collapsed flag restored
     to false by the very edit being undone, independent of radar. Radar's
     memory doesn't know that "the reason it was collapsed" no longer
     applies, so forget it entirely and let refreshRadarExpansion() (called
     by render() just below) rebuild it fresh against the now-current state:
     anything still collapsed and still required gets force-opened again;
     anything the undo/redo already opened on its own is simply left alone,
     so radar-off later can never re-collapse what the user just undid. */

}
function undo() {
  if (!UNDO.length) { toast('אין מה לבטל — Nothing to undo'); return; }
  REDO.push(JSON.stringify(S));
  applyState(UNDO.pop());
  toast('בוטל — Undone');
}
function redo() {
  if (!REDO.length) { toast('אין מה לשחזר — Nothing to redo'); return; }
  UNDO.push(JSON.stringify(S));
  applyState(REDO.pop());
  toast('שוחזר — Redone');
}
/* Replacing the whole state (a host `gm:load`, or a file import) is always
   allowed to be undone too — snapshot first, exactly like a normal edit. */
function replaceState(next, msg) {
  UNDO.push(JSON.stringify(S));
  if (UNDO.length > UNDO_CAP) UNDO.shift();
  REDO.length = 0;
  S = next;
  S.updatedAt = Date.now();
  if (UI.sel && !N(UI.sel)) UI.sel = null;
  UI.marks = {}; UI.relFrom = null;
  snapPrev = JSON.stringify(S);
  writeLocal();
  render();
  if (msg) toast(msg);
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   GlassMap — engine part 2: layout geometry, settling, rendering.
   Ported from WaffleTask's spread()/settleMap()/mapWorld() (index.html
   1378-1734). The radial-tree wedge algorithm, the wobble on each wire and
   the settle pass are unchanged in spirit; "project" and "task" collapse
   into one node kind, and the hub becomes the root.
   ═══════════════════════════════════════════════════════════════════════ */

/* A radial tree: every node owns an angular wedge; its children divide that
   wedge between them, weighted by how many leaves each carries, so a
   subtree can never swing round on top of its own parent or into a
   sibling's space. Crowded levels push further out rather than overlapping. */
var MAP_R = 260;
var MAP_BOUNDS = [];
var MAP_DRAG_UNTIL = 0, MAP_DRAG_ID = '';
/* Belt and braces for the click that goes missing — CLICK_SEEN is stamped
   whenever a real click lands inside #world; if a press-and-release
   produced no such click, the pointerup net delivers the action itself.
   Both bugs are documented in waffletask-board.md ("Drag lock-up",
   "pointer capture"); the fixes below are copied verbatim. */
var CLICK_SEEN = 0, CTL_PRESS = null;
var EDGE = [0, 300, 194, 154, 134, 122];
function edgeAt(d) { return EDGE[d] || 158; }

function jit(id, salt) {
  var h = 0, s = String(id) + '|' + salt;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 10007;
  return h / 10007 * 2 - 1;
}
/* A connector with a little wobble in it — drawn, not ruled. Tree wires
   only; relation arrows are drawn straight + dashed so the two kinds of
   line never get confused (contract: "relation arrows (dashed, arrowhead)"
   says nothing about a bow, and a straight line is what reads as "this is
   a different kind of connection"). */
function wire(x1, y1, x2, y2, seed) {
  var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
  var off = jit(seed, 'bow') * Math.min(26, len * 0.11);
  var cx = (x1 + x2) / 2 - dy / len * off, cy = (y1 + y2) / 2 + dx / len * off;
  return 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
         ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1);
}
/* How much of the circle each of the root's children may claim, from the
   gap to its neighbours — so no two top-level branches can grow into each
   other. */
function wedges(angs) {
  var n = angs.length;
  if (n <= 1) return [Math.PI * 1.9];
  var ord = angs.map(function (a, i) {
    return { a: ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI), i: i };
  }).sort(function (x, y) { return x.a - y.a; });
  var out = new Array(n);
  ord.forEach(function (cur, k) {
    var prev = ord[(k - 1 + n) % n], next = ord[(k + 1) % n];
    var gp = cur.a - prev.a; if (gp <= 0) gp += 2 * Math.PI;
    var gn = next.a - cur.a; if (gn <= 0) gn += 2 * Math.PI;

}
/* Place every descendant of one node, recursively. A first guess kept
   deliberately tight; settleMap() afterwards measures the real boxes and
   pushes apart anything that actually collides — growing the radius to
   guarantee separation up front is what made WaffleTask's tree sprawl. A
   collapsed node stops the recursion (its children are simply never
   emitted — they don't exist on the plane at all while folded). */
function spread(pId, px, py, center, span, depth, emit) {
  if (depth > 14) return;
  var pnode = N(pId);
  if (pnode && pnode.collapsed) return;

  if (!kids.length) return;
  var w = kids.map(function (k) { return leafCount(k.id); });

  var r = edgeAt(depth) + Math.max(0, kids.length - 3) * 14;
  var a = center - span / 2;
  kids.forEach(function (k, i) {
    var s = span * w[i] / tot;
    var ang = a + s / 2;
    a += s;
    var x = px + Math.cos(ang) * r, y = py + Math.sin(ang) * r;
    if (typeof k.mx === 'number' && typeof k.my === 'number') {

      ang = Math.atan2(y - py, x - px);
      if (!isFinite(ang)) ang = 0;

    spread(k.id, x, y, ang, Math.min(s, Math.PI * 0.85), depth + 1, emit);

/* ── settling ────────────────────────────────────────────────────────────
   Nudge overlapping nodes apart along whichever axis they overlap least,
   using the sizes the browser actually laid out. Anything hand-placed is
   pinned and never shoved. */
function settleMap(skipRelax) {
  var world = el('#world'); if (!world) return;

     offsetWidth/offsetHeight — i.e. its size at whatever LOD tier the view
     happens to be in the moment render() runs. But root and depth-1 titles
     counter-scale their font UP TO 2.2x at lod-far (A1, "so root/depth-1
     titles stay legible" — see the .mapwrap.lod-far CSS above), and that is
     a real font-size change, not a transform, so it genuinely grows the
     node's world-space box. A 200-node map settles at lod-near/mid sizing
     (that's what's on screen when render() runs), then Ctrl+0 zooms out to
     fit everything, crossing into lod-far — at which point sibling
     root-children's titles balloon up to 2.2x AFTER settling already
     decided they had just enough room apart at their small size, so they
     end up overlapping with no further settle pass ever re-checking it.
     Reserve room for that worst case up front for exactly the two levels
     that ever counter-scale (root = depth 0, and depth 1), so the very
     first settle already leaves enough of a gap that ballooning into it
     later at lod-far can never reopen an overlap. */
  var LOD_GROW = 2.2;
  var list = els('.gm-node', world).map(function (n) {
    var depth = n.dataset.depth != null ? +n.dataset.depth : 1;
    var grow = (depth === 0 || depth === 1) ? LOD_GROW : 1;
    return {
      el: n,
      x: n.dataset.x != null ? +n.dataset.x : 0,
      y: n.dataset.y != null ? +n.dataset.y : 0,
      w: n.offsetWidth * grow, h: n.offsetHeight * grow,
      id: n.dataset.node,
      par: n.dataset.par || '',

    };
  });

  if (!skipRelax) {

    /* D10 fix (part 1): 60 passes settles a typical few-dozen-node map fine,
       but a dense 200-node stress map needs more rounds for a pairwise
       relaxation to propagate all the way through — scale the cap with node
       count (cheap: O(n^2) per pass, still trivial at this size) instead of
       a fixed constant that only covers small maps. (Part 2, below, is the
       actual root cause of the residual overlaps a bigger cap alone didn't
       fix — the LOD_GROW reservation above.) */
    var ITER_CAP = Math.max(60, Math.min(400, list.length * 3));
    for (var it = 0; it < ITER_CAP; it++) {

      for (var i = 0; i < list.length; i++) {
        for (var j = i + 1; j < list.length; j++) {

            var dx = (A.x <= B.x ? -1 : 1) * (ox / 2 + 0.5);
            if (moveA && moveB) { A.x += dx; B.x -= dx; }
            else if (moveA) A.x += dx * 2; else B.x -= dx * 2;
          } else {
            var dy = (A.y <= B.y ? -1 : 1) * (oy / 2 + 0.5);
            if (moveA && moveB) { A.y += dy; B.y -= dy; }
            else if (moveA) A.y += dy * 2; else B.y -= dy * 2;
          }
        }
      }
      if (!moved) break;
    }

  var at = {}, pts = [];
  list.forEach(function (n) {
    n.el.style.left = n.x.toFixed(1) + 'px';
    n.el.style.top = n.y.toFixed(1) + 'px';
    n.el.dataset.x = n.x.toFixed(1);
    n.el.dataset.y = n.y.toFixed(1);
    at[n.id] = n;
    pts.push([n.x, n.y, n.w / 2 + 10, n.h / 2 + 10]);
  });

  var svg = el('.gm-wires', world);
  if (svg) {
    var treePaths = list.map(function (n) {
      if (!n.par) return '';
      var p = at[n.par]; if (!p) return '';
      var d = +n.el.dataset.depth || 1;
      var dim = n.el.classList.contains('hazed') ? 0.25 : 1;
      /* A6: in the cards layer, radar ghosts the SELECTED node's own wires
         back in via the same .gm-peek mechanism hover already uses there
         (contract: "in cards layer the radar draws the selected node's
         wires as ghosts") — no separate code path needed. */
      var radarPeek = UI.radar && (n.id === UI.sel || n.par === UI.sel);
      return '<path class="tree' + (radarPeek ? ' gm-peek' : '') + '" data-id="' + n.id + '" data-par="' + n.par + '" d="' + wire(p.x, p.y, n.x, n.y, n.id) +
        '" stroke="' + n.col + '" stroke-width="' + Math.max(1.2, 3 - d * 0.4) + '" opacity="' +
        ((0.32 + Math.max(0, 0.5 - d * 0.08)) * dim).toFixed(2) + '"' +
        (d > 2 ? ' stroke-dasharray="1 6"' : '') + '/>';
    }).join('');
    svg.innerHTML = '<defs><marker id="gmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="var(--sh-text-med)"/></marker></defs>' + treePaths + relPaths(at);
  }

}
/* Relations connect ANY two nodes, so their geometry is computed separately
   from the tree wires above — straight, dashed, an arrowhead at `to`. */
function relPaths(at) {
  return S.links.map(function (l) {
    var a = at[l.from], b = at[l.to]; if (!a || !b) return '';
    var haze = (a.el.classList.contains('hazed') || b.el.classList.contains('hazed'));

       2px while radar is on, regardless of haze (contract Addendum A6). */
    var radarFull = UI.radar && UI.sel && (l.from === UI.sel || l.to === UI.sel);
    var op = radarFull ? 1 : (haze ? 0.15 : 0.65);
    var w = radarFull ? 2 : 1.6;

      ' L' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + '" stroke="var(--sh-text-med)" stroke-width="' + w + '"' +

  S.links.forEach(function (l) {
    var a = at[l.from], b = at[l.to]; if (!a || !b) return;
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var pill = document.createElement('div');
    pill.className = 'gm-rellabel gm-glass gm-bidi';
    pill.dataset.link = l.id;
    pill.style.left = mx.toFixed(1) + 'px'; pill.style.top = my.toFixed(1) + 'px';
    pill.innerHTML = '<span class="gm-relttl">' + esc(l.label || '···') + '</span><button class="gm-relx" data-dellink="' + l.id + '" aria-label="Remove relation" title="הסר קשר — remove">&#10005;</button>';

function isSel(id) { return UI.sel === id; }

/* ── what stays sharp under the lens ─────────────────────────────────────
   Whatever you're actually on: its ancestor chain up to the root, plus its
   whole subtree. Nothing selected = nothing hazed (contract ports
   WaffleTask's lens 1:1, minus the 1·2·3 / today branches that don't exist
   here). */
function lensSet() {
  if (!UI.lens || !UI.sel || !N(UI.sel)) return null;
  var keep = {}, t = N(UI.sel), hops = 0;
  while (t && hops++ < 24) { keep[t.id] = 1; t = t.parent ? N(t.parent) : null; }
  descendantsOf(UI.sel).forEach(function (d) { keep[d.id] = 1; });

}
/* ── A6 link radar — what stays sharp while it's on ─────────────────────
   Selected node, its parent, its children, and everything it's cross-
   linked with either direction (contract Addendum A6). Independent of the
   focus lens above — a node must survive EVERY active filter to stay sharp

function radarSet() {
  if (!UI.radar || !UI.sel || !N(UI.sel)) return null;
  var sel = N(UI.sel), keep = {};
  keep[sel.id] = 1;
  if (sel.parent != null) keep[sel.parent] = 1;
  childrenOf(sel.id).forEach(function (c) { keep[c.id] = 1; });
  linksOf(sel.id).forEach(function (l) { keep[l.from] = 1; keep[l.to] = 1; });

   the root itself, so the spine reads) stays sharp; the rest of the map
   hazes exactly like the lens. */
function soloSet() {

  var keep = {}, root = rootNode();
  keep[root.id] = 1;
  keep[UI.soloBranch] = 1;
  descendantsOf(UI.soloBranch).forEach(function (d) { keep[d.id] = 1; });
  return keep;
}
/* Combine lens/radar/solo: a node must pass every currently-active filter

   *Set() functions above already returns null when its own toggle is off,
   so an inactive filter never contributes a haze. */

  return (sets.lens && !sets.lens[id]) || (sets.radar && !sets.radar[id]) || (sets.solo && !sets.solo[id]);
}

/* ── the plane's contents ────────────────────────────────────────────── */
function mapWorld() {
  var HAZE = hazeSets();
  var nodes = '';
  var root = rootNode();

  function depthDots(depth) {
    var n = Math.min(depth, 5), out = '';
    for (var i = 0; i < n; i++) out += '<i></i>';
    return out;
  }
  function nodeHTML(node, x, y, depth, parId, accentVar) {
    var isRoot = !node.parent;
    var kids = childrenOf(node.id);
    var haze = isHazed(HAZE, node.id);
    var marked = !!UI.marks[node.id];
    var pinned = (typeof node.mx === 'number' && typeof node.my === 'number');
    var accent = isRoot ? '' : (node.accent || accentVar || ACCENTS[0]);
    var collapsedCount = node.collapsed ? descendantsOf(node.id).length : 0;
    var kind = node.kind && KINDS.indexOf(node.kind) > 0 ? node.kind : '';  /* A4: 'concept' (index 0) never gets a class */
    var glyph = kind ? KIND_GLYPH[kind] : '';
    var hub = linksOf(node.id).length >= 2;                                /* A7 */
    var bridgeEditing = UI.editingBridge === node.id;
    var hint = 'לחיצה לבחירה · לחיצה כפולה לעריכה — click to select, double-click to rename' +
      (node.bridge ? ' — 🪙 ' + node.bridge : '');                          /* A5: tooltip works at any zoom */
    nodes += '<div class="gm-node gm-glass' + (isRoot ? ' root' : '') + (isSel(node.id) ? ' sel' : '') +
      (marked ? ' marked' : '') + (haze ? ' hazed' : '') + (UI.relFrom === node.id ? ' relsrc' : '') +
      (kind ? ' gm-kind-' + kind : '') + (hub ? ' hub' : '') + '"' +
      ' data-node="' + node.id + '" data-x="' + x.toFixed(1) + '" data-y="' + y.toFixed(1) + '"' +
      ' data-depth="' + depth + '" data-par="' + esc(parId || '') + '" data-col="var(' + accent + ')"' +
      ' data-pinned="' + (isRoot ? 2 : (pinned ? 1 : 0)) + '"' +
      (node.collapsed ? ' data-collapsed="1"' : '') +
      ' style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px' + (accent ? ';--acc:var(' + accent + ')' : '') + '"' +
      ' role="button" tabindex="0" title="' + esc(hint) + '">' +
      (accent ? '<span class="gm-stripe" aria-hidden="true"></span>' : '') +
      '<span class="gm-ttl gm-bidi" dir="auto">' +
        (glyph ? '<span class="gm-glyph" aria-hidden="true">' + glyph + '</span>' : '') +
        esc(node.title) + '</span>' +
      (node.bridge != null ? '<div class="gm-bridge gm-bidi' + (bridgeEditing ? ' force' : '') + '" data-bridge="' + node.id + '">' +
        '<span aria-hidden="true">🪙</span><span class="gm-bridge-txt" dir="auto">' + esc(node.bridge) + '</span></div>' : '') +
      '<div class="gm-meta">' +
        (node.body ? '<span class="gm-note-mark" title="יש הערה — has a note">&#9998;</span>' : '') +
        (node.collapsed && collapsedCount ? '<span class="gm-badge" title="מקופל — collapsed">+' + collapsedCount + '</span>' : '') +
      '</div>' +
      '<div class="gm-depthdots" aria-hidden="true">' + depthDots(depth) + '</div>' +
      (isSel(node.id) ? '<button class="addkid" data-addkid="' + node.id + '" title="הוסף תת-נושא (Tab) — add a child" aria-label="Add a child">+</button>' : '') +
    '</div>';
  }

  spread(root.id, 0, 0, 0, Math.PI * 2, 1, function (n, x, y, d, par) {
    nodeHTML(n, x, y, d, par, n.accent);
  });
  nodeHTML(Object.assign({}, root, { accent: null }), 0, 0, 0, '', null);
  /* nodeHTML always appends — the call above ran once more for the root
     itself, after its children were emitted, so it draws on top (z-order:
     later markup, later in DOM, and .root has no stripe/lens dimming logic
     collision since isRoot short-circuits accent). */

  return '<svg class="gm-wires"></svg>' + nodes;
}

function renderMap() {
  var world = mapWorld();
  el('#world').innerHTML = world;
  var findOn = !el('#findBar').hidden;
  el('#gmHint').innerHTML = findOn ? '' :
    '<b>Tab</b> תת-נושא &middot; <b>Enter</b> אח אחריך &middot; <b>Ctrl+L</b> קשר &middot; <b>?</b> עזרה' +
    ' &nbsp;·&nbsp; <b>Tab</b> child &middot; <b>Enter</b> sibling &middot; <b>Ctrl+L</b> relate &middot; <b>?</b> help';
  el('#mapwrap').dataset.layer = S.layer;
  renderMapctl();
}
function renderMapctl() {
  var c = el('#mapctl');
  c.innerHTML =
    '<button class="gm-btn icon" id="undoBtn" title="בטל (Ctrl+Z) — Undo" aria-label="Undo">&#8630;</button>' +
    '<button class="gm-btn icon" data-zoom="1" aria-label="Zoom in">+</button>' +
    '<button class="gm-btn icon" data-zoom="-1" aria-label="Zoom out">&minus;</button>' +
    '<button class="gm-btn icon" data-zoom="0" title="התאם הכל (Ctrl+0) — fit" aria-label="Fit the map">&#9678;</button>' +
    '<button class="gm-btn icon' + (S.layer === 'cards' ? ' on' : '') + '" id="layerBtn"' +
      ' title="שכבה (L) — links/cards layer" aria-label="Toggle layer">' + (S.layer === 'cards' ? '🪟' : '⛓️') + '</button>' +
    '<button class="gm-btn icon' + (UI.lens ? ' on' : '') + '" id="lensBtn" aria-pressed="' + !!UI.lens + '"' +
      ' title="עדשת מיקוד — focus lens" aria-label="Toggle the focus lens">&#9673;</button>' +

}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   GlassMap — engine part 3: camera (pan/zoom/fit/glide), selection,
   the XMind-style keyboard, arrow-key geometry, and the tree-growing ops.
   Ported from WaffleTask index.html 1736-2141 (mapView/applyMap/mapExtent/
   barGeom/updateBars/animateMap/focusOn/ensureVisible/selNode/…/mapKeys/
   fitMap/zoomAt/placeInitial/worldBoxes/hitsAny) with the project/task
   split removed. The camera itself is persisted in S.view per the contract
   ("view:{x,y,z,fit,touched}" survives reload) instead of living in a
   throwaway UI object — `mapView()` keeps its WaffleTask name but now
   returns S.view.
   ═══════════════════════════════════════════════════════════════════════ */

function mapView() { return S.view; }
/* A1: the three altitudes, purely a function of z — see contract Addendum
   A1's thresholds verbatim. */
function lodClass(z) {
  if (z < 0.45) return 'lod-far';
  if (z < 0.9) return 'lod-mid';
  return 'lod-near';
}
function applyMap() {
  var w = el('#world'); if (!w) return;
  var v = mapView();
  w.style.transform = 'translate(' + v.x.toFixed(1) + 'px,' + v.y.toFixed(1) + 'px) scale(' + v.z.toFixed(3) + ')';
  /* A1 semantic zoom: every camera move (pan, zoom, glide, tween step) runs
     through here, so the LOD class and the --gm-z counter-scale variable
     are always current — never set anywhere else. */
  var wrap = el('#mapwrap');
  if (wrap) {
    wrap.style.setProperty('--gm-z', v.z);
    var cls = lodClass(v.z);
    if (wrap.dataset.lod !== cls) {
      wrap.classList.remove('lod-far', 'lod-mid', 'lod-near');
      wrap.classList.add(cls);
      wrap.dataset.lod = cls;
    }
  }
  updateBars();
}
var viewPersistTimer = null;
function schedulePersistView() {
  clearTimeout(viewPersistTimer);
  viewPersistTimer = setTimeout(persistSoft, 400);
}
function mapExtent() {
  var wrap = el('#mapwrap'); if (!wrap || !MAP_BOUNDS.length) return null;
  var r = wrap.getBoundingClientRect(); if (!r.width || !r.height) return null;
  var v = mapView(), pad = 120;
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  MAP_BOUNDS.forEach(function (b) {
    minX = Math.min(minX, b[0] - b[2]); maxX = Math.max(maxX, b[0] + b[2]);
    minY = Math.min(minY, b[1] - b[3]); maxY = Math.max(maxY, b[1] + b[3]);
  });
  minX -= pad; maxX += pad; minY -= pad; maxY += pad;   /* content bounds only — see waffletask-board.md */
  return {
    L: minX, R: maxX, T: minY, B: maxY,
    viewL: -v.x / v.z, viewT: -v.y / v.z,
    viewW: r.width / v.z, viewH: r.height / v.z,
    z: v.z, r: r

}
function barGeom(e, horiz) {
  var total = horiz ? (e.R - e.L) : (e.B - e.T);
  var view = horiz ? e.viewW : e.viewH;
  var at = (horiz ? e.viewL : e.viewT) - (horiz ? e.L : e.T);
  var scroll = Math.max(0, total - view);
  return {
    total: total, view: view, scroll: scroll,
    size: Math.max(0.06, Math.min(1, view / (total || 1))),
    pos: scroll > 0 ? Math.max(0, Math.min(1, at / scroll)) : 0,
    fits: scroll < 1

}
function updateBars() {
  var e = mapExtent(); if (!e) return;
  [[el('#mbarH'), true], [el('#mbarV'), false]].forEach(function (pair) {
    var bar = pair[0], horiz = pair[1];
    if (!bar) return;
    var g = barGeom(e, horiz);
    bar.style.display = g.fits ? 'none' : '';
    if (g.fits) return;
    var th = bar.firstElementChild;
    var free = 1 - g.size;
    if (horiz) { th.style.width = (g.size * 100) + '%'; th.style.left = (g.pos * free * 100) + '%'; }
    else { th.style.height = (g.size * 100) + '%'; th.style.top = (g.pos * free * 100) + '%'; }
  });
}

/* ── gliding the view ────────────────────────────────────────────────── */
var MAP_ANIM = 0, FOCUS_Z = 1.35;
/* E8 fix: the tween's own destination, while one is in flight; null once it
   settles (or never started). jumpSnapshot() (A3 jump history) reads THIS
   instead of the live view when set, so interrupting a tween with Alt+←
   records where the camera was actually GOING, not an arbitrary mid-glide
   position — otherwise Alt+→ "redo" would restore that arbitrary point
   instead of the dive/zoom-to-branch's real, fully-settled target. */
var MAP_ANIM_TARGET = null;
function cancelMapAnim() { if (MAP_ANIM) { cancelAnimationFrame(MAP_ANIM); MAP_ANIM = 0; } }
function reduceMotion() {
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}
function animateMap(tx, ty, tz, ms) {
  cancelMapAnim();
  var v = mapView();
  MAP_ANIM_TARGET = { x: tx, y: ty, z: tz };
  if (!ms || reduceMotion()) { v.x = tx; v.y = ty; v.z = tz; applyMap(); schedulePersistView(); MAP_ANIM_TARGET = null; return; }
  var sx = v.x, sy = v.y, sz = v.z, t0 = 0;
  MAP_ANIM = requestAnimationFrame(function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / ms);
    var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    v.x = sx + (tx - sx) * e; v.y = sy + (ty - sy) * e; v.z = sz + (tz - sz) * e;
    applyMap();
    if (p >= 1) { MAP_ANIM = 0; MAP_ANIM_TARGET = null; schedulePersistView(); } else MAP_ANIM = requestAnimationFrame(step);
  });
}
function focusOn(wx, wy, z, ms) {
  var wrap = el('#mapwrap'); if (!wrap) return;
  var r = wrap.getBoundingClientRect();
  z = Math.max(0.22, Math.min(2.4, z));
  mapView().fit = true;
  animateMap(r.width / 2 - wx * z, r.height / 2 - wy * z, z, ms == null ? 460 : ms);
}
function ensureVisible(node) {
  var wrap = el('#mapwrap'); if (!wrap || !node) return;
  var r = wrap.getBoundingClientRect(), b = node.getBoundingClientRect();
  var pad = 70;
  if (b.left >= r.left + pad && b.right <= r.right - pad &&
      b.top >= r.top + pad && b.bottom <= r.bottom - pad) return;
  var x = parseFloat(node.dataset.x), y = parseFloat(node.dataset.y);
  if (isNaN(x) || isNaN(y)) { x = 0; y = 0; }
  var v = mapView();
  v.touched = true;
  animateMap(r.width / 2 - x * v.z, r.height / 2 - y * v.z, v.z, 380);
}

/* ── selection ───────────────────────────────────────────────────────── */
function selDom() { return UI.sel ? el('.gm-node[data-node="' + UI.sel + '"]') : null; }
function selText(n) { return n ? n.querySelector('.gm-ttl') : null; }
function selNode(id, opts) {
  UI.sel = id;
  render();
  var n = selDom();
  if (n && !(opts && opts.quiet)) ensureVisible(n);
  return n;
}
function editSelected(onCancel) {
  var node = UI.sel && N(UI.sel), n = selDom(), t = selText(n);
  if (!node || !t) return;
  inlineEdit(t, function (v) { node.title = v; save(); render(); }, { grow: true, onCancel: onCancel });
}
/* Open the body sheet for the selected node's notes (key `E`). */
function editSelectedBody() {
  var node = UI.sel && N(UI.sel);
  if (!node) { toast('בחר נושא קודם — select a node first'); return; }
  openBodySheet(node.id);
}

/* ── growing the tree — Tab / Enter / Shift+Enter / Ctrl+Enter / Ctrl+D ──
   Names kept from WaffleTask (growChild/growSibling/growAndEdit) even
   though there is no more project/task split to dispatch on. */
/* D1/D11 fix: these four "grow" functions used to call save() the instant
   they ran — pushing a blank-titled node into S AND committing it to the
   undo stack and localStorage before the inline-edit box the caller opens
   right after even exists. That meant (a) a single Ctrl+Z after typing a
   real title only undid the LABEL commit, leaving a permanent empty-titled
   orphan behind (a second Ctrl+Z was needed), and (b) Escape — or simply
   reloading — before ever typing anything still left that blank node
   sitting in the tree and already durably saved. They now only mutate
   S.nodes/S.links in memory; growAndEdit() (below) is the sole caller and
   owns the single save() for the whole gesture — either committing the
   real title in one shot, or rolling the in-memory mutation back to
   nothing if the edit is cancelled. */
function newChildOf(pid) {
  var n = { id: uid('n'), parent: pid, title: '', body: '', accent: accentFor(pid) };
  S.nodes.push(n);
  return n.id;
}
function growChild() {
  var pid = (UI.sel && N(UI.sel)) ? UI.sel : rootNode().id;
  return newChildOf(pid);
}
function growSibling() {
  var node = UI.sel && N(UI.sel);
  if (!node) return growChild();
  if (!node.parent) return newChildOf(node.id);           /* root selected: only "child of root" makes sense */
  var n = { id: uid('n'), parent: node.parent, title: '', body: '', accent: accentFor(node.parent) };
  var idx = S.nodes.indexOf(node);
  S.nodes.splice(idx + 1, 0, n);                            /* next sibling, right after `node` in array order */
  return n.id;
}
function growSiblingBefore() {
  var node = UI.sel && N(UI.sel);
  if (!node) return growChild();
  if (!node.parent) return newChildOf(node.id);
  var n = { id: uid('n'), parent: node.parent, title: '', body: '', accent: accentFor(node.parent) };
  var idx = S.nodes.indexOf(node);
  S.nodes.splice(idx, 0, n);                                /* previous sibling, right before `node` */
  return n.id;
}
/* Ctrl+Enter — insert a new parent between the selection and its own
   parent. The new node takes the selection's old slot in the array (so it
   lands in the same sibling position under the old parent), and the
   selection is reparented under it. */
function insertParent() {
  var node = UI.sel && N(UI.sel);
  if (!node) return null;
  if (!node.parent) { toast('לשורש אין הורה — the root has no parent to insert above'); return null; }
  var p = { id: uid('n'), parent: node.parent, title: '', body: '', accent: node.accent };
  var idx = S.nodes.indexOf(node);
  S.nodes.splice(idx, 0, p);
  node.parent = p.id;
  return p.id;
}
/* Ctrl+D — duplicate the selected node and its whole subtree as the next
   sibling. Hand-placed positions are deliberately NOT copied: laying the
   clone out fresh keeps it from landing exactly on top of the original. */
function duplicateNode(id) {
  var orig = N(id); if (!orig) return null;
  if (!orig.parent) { toast('אי אפשר לשכפל את השורש — cannot duplicate the root'); return null; }
  var clones = [];
  function cloneRec(n, newParent) {
    var c = { id: uid('n'), parent: newParent, title: n.title, body: n.body, accent: n.accent, collapsed: n.collapsed, kind: n.kind, bridge: n.bridge };
    clones.push(c);
    childrenOf(n.id).forEach(function (k) { cloneRec(k, c.id); });
    return c;
  }
  var top = cloneRec(orig, orig.parent);
  var idx = S.nodes.indexOf(orig);
  S.nodes.splice(idx + 1, 0, top);
  clones.filter(function (c) { return c !== top; }).forEach(function (c) { S.nodes.push(c); });

}
/* `blank` marks the four Tab/Enter/Shift+Enter/Ctrl+Enter creation paths,
   whose new node/parent starts out titleless: their whole gesture (the
   structural mutation `make()` just performed, PLUS the title the user is
   about to type) is one undo step and one save (D1), and if the inline
   edit that follows is cancelled — Escape, or a blur/Tab with nothing ever
   typed — the mutation is rolled back in memory to before it happened,
   nothing having been saved at all (D11). Ctrl+D (duplicateNode) does NOT
   pass `blank`: it already has real content and already saved itself, so
   accepting its pre-filled title as-is (the common "just duplicate it, no
   rename needed" flow) must NOT be treated as "cancelled" and rolled back. */
function growAndEdit(make, blank) {
  if (UI.relFrom) cancelRelation();     /* D3: a growth action always retires a pending Ctrl+L relation */
  var beforeSel = UI.sel;
  var beforeNodes = blank ? JSON.parse(JSON.stringify(S.nodes)) : null;
  var next = make();
  if (!next) return;
  UI.sel = next;
  mapView().touched = true;
  render();
  var n = selDom();
  if (n) {
    ensureVisible(n);
    setTimeout(function () {
      editSelected(blank ? function () {
        S.nodes = beforeNodes;
        UI.sel = (beforeSel && N(beforeSel)) ? beforeSel : null;
        render();
      } : null);
    }, 30);

}

/* ── delete ──────────────────────────────────────────────────────────────
   Contract: "first press arms + toast, second press deletes subtree" —
   ported from WaffleTask's DEL_ARMED pattern, extended to a marked set
   (multi-select is an explicitly-ported engine part; without SOME action it
   would be pointless — see the design notes returned with this file). */
var DEL_ARMED = 0;
var DEL_ARMED_FOR = '';
function doomedSet(ids) {
  var d = {};
  ids.forEach(function (id) { d[id] = 1; descendantsOf(id).forEach(function (x) { d[x.id] = 1; }); });
  return d;
}
function deleteIds(ids) {
  var d = doomedSet(ids);
  var n = Object.keys(d).length;
  S.nodes = S.nodes.filter(function (x) { return !d[x.id]; });
  S.links = S.links.filter(function (l) { return !d[l.from] && !d[l.to]; });
  if (UI.sel && d[UI.sel]) UI.sel = null;
  Object.keys(UI.marks).forEach(function (id) { if (d[id]) delete UI.marks[id]; });
  save(); render();
  toast('נמחקו ' + n + ' — Deleted ' + n + ' — Ctrl+Z לביטול / to undo');
}
function markedIds() { return Object.keys(UI.marks).filter(function (id) { return N(id); }); }
function clearMarks() { UI.marks = {}; }
function toggleMark(id) { if (UI.marks[id]) delete UI.marks[id]; else UI.marks[id] = 1; }
function markBranch(id) {
  UI.marks[id] = 1;
  descendantsOf(id).forEach(function (d) { UI.marks[d.id] = 1; });
}

/* ── arrow keys: step to the nearest node that way ───────────────────────
   The map is a plane, not an outline, so arrows navigate by GEOMETRY, not
   tree structure — ported verbatim from WaffleTask's stepSel/landOn
   (index.html 1933-2008), including the exact cone/scoring constants. */
var ARROWS = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
function planeNodes() {
  return els('.gm-node[data-node]').map(function (n) {
    return { el: n, id: n.dataset.node, x: +n.dataset.x || 0, y: +n.dataset.y || 0 };
  });
}
function viewCentreWorld() {
  var wrap = el('#mapwrap'), v = mapView();
  if (!wrap) return { x: 0, y: 0 };
  var r = wrap.getBoundingClientRect();
  return { x: (r.width / 2 - v.x) / v.z, y: (r.height / 2 - v.y) / v.z };
}
function landOn(node, from, extend) {
  if (extend) {
    UI.marks[node.id] = 1;
    if (from) UI.marks[from.id] = 1;
    UI.sel = node.id;
    render();
    var n = selDom(); if (n) ensureVisible(n);
    return;
  }
  clearMarks();
  selNode(node.id);
}
function stepSel(dir, extend) {
  var list = planeNodes();
  if (!list.length) return false;
  var from = null;
  if (UI.sel) list.forEach(function (n) { if (n.id === UI.sel) from = n; });
  if (!from) {
    var c = viewCentreWorld(), near = null, nd = Infinity;
    list.forEach(function (n) {
      var d = (n.x - c.x) * (n.x - c.x) + (n.y - c.y) * (n.y - c.y);
      if (d < nd) { nd = d; near = n; }
    });
    if (!near) return false;
    landOn(near, null, false);
    return true;
  }
  var ax = dir[0], ay = dir[1], pick = null, best = Infinity;
  list.forEach(function (n) {
    if (n === from) return;
    var dx = n.x - from.x, dy = n.y - from.y;
    var along = dx * ax + dy * ay;
    if (along <= 6) return;
    var perp = Math.abs(dx * ay - dy * ax);
    if (perp > along * 1.7 + 40) return;
    var score = along + perp * 1.9;
    if (score < best) { best = score; pick = n; }
  });
  if (!pick) return false;
  landOn(pick, from, extend);
  return true;
}

/* ── find ────────────────────────────────────────────────────────────────
   `/` or Ctrl+F opens the pill; typing hazes non-matches live; Enter jumps
   to the first hit; Esc clears (contract keyboard table). Not part of the
   ported WaffleTask engine (it had no find) — new, but reuses `.hazed`. */
function findMatches() {
  var q = UI.find.trim().toLowerCase();
  if (!q) return null;
  var hit = {};
  S.nodes.forEach(function (n) { if ((n.title || '').toLowerCase().indexOf(q) >= 0) hit[n.id] = 1; });
  return hit;
}
function applyFindHaze() {
  var hit = findMatches();
  els('.gm-node').forEach(function (n) {
    if (!hit) { n.classList.remove('hazed'); return; }
    n.classList.toggle('hazed', !hit[n.dataset.node]);
  });
  el('#findCount').textContent = hit ? 'נמצאו ' + Object.keys(hit).length : '';
}
function openFind() {
  var bar = el('#findBar'); bar.hidden = false;
  el('#findInput').value = UI.find; el('#findInput').focus(); el('#findInput').select();
  applyFindHaze();
}
function closeFind() {
  UI.find = '';
  el('#findBar').hidden = true;
  els('.gm-node').forEach(function (n) { n.classList.remove('hazed'); });
  el('#findCount').textContent = '';
}
function findJumpFirst() {
  var hit = findMatches(); if (!hit) return;
  var id = Object.keys(hit)[0]; if (!id) { toast('אין תוצאות — no matches'); return; }
  pushJumpHistory();   /* A3: find-Enter is one of the listed "programmatic jump" triggers */
  selNode(id);
}

/* ── relations (Ctrl+L) ─────────────────────────────────────────────────
   New engine part (WaffleTask had none — it is a task board, not a
   relations graph). Ctrl+L arms UI.relFrom; the next click on a DIFFERENT
   node completes it (handled in mountMap's pointerup, `stop()`); Esc
   cancels first, ahead of clearing marks or deselecting (contract's Esc
   ordering). */
function startRelation() {
  if (!UI.sel) { toast('בחר נושא קודם — select a node first'); return; }
  UI.relFrom = UI.sel;
  el('#mapwrap').classList.add('relmode');
  render();
  toast('קשר: לחץ על נושא יעד, Esc לביטול — relation: click a target, Esc to cancel');
}
function cancelRelation() {
  UI.relFrom = null;
  el('#mapwrap').classList.remove('relmode');
  render();
}
function completeRelation(toId) {
  var fromId = UI.relFrom;
  cancelRelation();
  if (!fromId || fromId === toId) return;
  var exists = S.links.some(function (l) { return (l.from === fromId && l.to === toId) || (l.from === toId && l.to === fromId); });
  if (exists) { toast('כבר קיים קשר — a relation already exists there'); return; }
  /* D1 (relation variant) fix: this used to save() the blank-labelled link
     immediately, then save() AGAIN when the label's inline edit committed —
     one Ctrl+L gesture, two undo entries, so a single Ctrl+Z only reverted
     the label and left the link behind. Mirror the node-growth fix: don't
     save() until the label is actually committed; if that edit is
     cancelled instead (Escape, or blur with nothing typed), the relation
     never happened and is removed rather than persisted half-done. */
  var l = { id: uid('l'), from: fromId, to: toId, label: '' };
  S.links.push(l);
  render();
  var pill = el('.gm-rellabel[data-link="' + l.id + '"] .gm-relttl');
  if (!pill) { save(); return; }         /* no label UI available — persist the (unlabelled) relation as-is */
  setTimeout(function () {
    inlineEdit(pill, function (v) { l.label = v; save(); render(); }, {
      onCancel: function () {
        S.links = S.links.filter(function (x) { return x.id !== l.id; });
        render();
      }
    });
  }, 30);
}
function deleteLink(id) {
  S.links = S.links.filter(function (l) { return l.id !== id; });
  save(); render();
}

/* ── collapse (Ctrl+/) ──────────────────────────────────────────────────── */
function toggleCollapse() {
  var node = UI.sel && N(UI.sel);
  if (!node) { toast('בחר נושא קודם — select a node first'); return; }
  var kids = childrenOf(node.id);
  if (!kids.length && !node.collapsed) { toast('אין תת-נושאים לקפל — nothing to collapse'); return; }
  node.collapsed = !node.collapsed;
  save(); render();

/* ── A8 breadcrumb spine ──────────────────────────────────────────────────
   root › … › parent › selected, top-start, RTL-aware from the ROOT title's
   own script direction (contract Addendum A8). Hidden when nothing is
   selected; more than 5 chips and the middle collapses into one "…" chip
   with a hover list of what it's hiding. Each real chip is a jump: it
   pushes history exactly like dive/surface/siblings do, then glides
   (doesn't zoom-to-branch — a breadcrumb click is "take me there", not
   "frame that whole branch"). */

  return chain;
}

  UI.sel = id;

  var n = selDom();

}

  if (!UI.sel || !N(UI.sel)) { bar.hidden = true; bar.innerHTML = ''; return; }
  var chain = ancestorChain(UI.sel);
  var cells = [];
  if (chain.length <= 5) {
    chain.forEach(function (n) { cells.push({ node: n }); });
  } else {
    cells.push({ node: chain[0] });
    cells.push({ ellipsis: chain.slice(1, chain.length - 3) });
    chain.slice(chain.length - 3).forEach(function (n) { cells.push({ node: n }); });
  }

  var sepGlyph = rtl ? '‹' : '›';
  var html = cells.map(function (c, i) {
    var sep = i > 0 ? '<span class="gm-crumb-sep" aria-hidden="true">' + sepGlyph + '</span>' : '';
    if (c.ellipsis) {
      var list = c.ellipsis.map(function (n) { return '<div class="gm-bidi">' + esc(n.title || '···') + '</div>'; }).join('');
      return sep + '<span class="gm-crumb-more" tabindex="0"><span class="gm-crumb">&hellip;</span>' +
        '<div class="gm-crumb-morelist">' + list + '</div></span>';

      '>' + esc(c.node.title || '···') + '</span>';

}

/* ── A9 branch legend rendering + drag ────────────────────────────────────
   One chip per top-level branch (max 9, "+n" beyond that); drag anywhere on

/* ── A11 collapsed-node peek ──────────────────────────────────────────────

/* ── frame ───────────────────────────────────────────────────────────── */
function render() {
  refreshRadarExpansion();
  renderMap();
  els('#mapctl [data-zoom]').forEach(function () {});   /* mapctl is rebuilt each render by renderMap() */
  mountMap();
  wirePeek(el('#mapwrap'));
  el('#docTitle').textContent = S.title;
  el('#themeBtn').textContent = resolveTheme() ? '🌙' : '☀';
  if (UI.find) applyFindHaze();
  renderCrumbs();
  renderLegend();
  /* E2 fix: render() replaces #world's whole subtree every time, which
     silently drops DOM focus off whatever node held it — so a keyboard
     user who moves selection with the arrow keys (stepSel/selNode, both of
     which call render()) never has the browser's own focus follow along,
     and A11's "focus via keyboard for 400ms" peek path was unreachable by
     any real keyboard interaction. Put focus back on the selected node's

}

<script>

       typing (caught by the contract's own test 1, which fires it right
       after typing a node's title). */

      e.preventDefault(); finish(true);
      if (opts.grow) growAndEdit(insertParent, true);
    } else if (e.key === 'Enter') {
      e.preventDefault(); finish(true);
      if (opts.grow) growAndEdit(e.shiftKey ? growSiblingBefore : growSibling, true);
    } else if (e.key === 'Tab') {
      e.preventDefault(); finish(true);

/* ── A10 quick switcher — Ctrl+K ───────────────────────────────────────────
   Simple subsequence fuzzy match (no library, per contract) over node
   titles, bridge chips, and relation labels; Hebrew and English, case-
   insensitive (case-folding is meaningless for Hebrew but harmless). A
   denser run of matched characters scores higher than the same letters
   scattered apart, so "grd" ranks "Gradient Descent" above a coincidental
   scatter-match in a longer unrelated title. */

  var out = [];
  S.nodes.forEach(function (n) {
    out.push({ kind: 'node', id: n.id, text: n.title || '···', crumb: crumbOf(n.id) });
    if (n.bridge) out.push({ kind: 'node', id: n.id, text: n.bridge, crumb: '🪙 ' + crumbOf(n.id) });
  });

    if (!l.label) return;
    var a = N(l.from), b = N(l.to);

    .map(function (c) { return { c: c, s: fuzzyScore(q, c.text) }; })
    .filter(function (x) { return x.s >= 0; })
    .sort(function (a, b) { return b.s - a.s; })

    return '<div class="gm-switch-row gm-bidi' + (i === UI.switcher.idx ? ' active' : '') + '" data-swidx="' + i + '">' +
      '<div>' + esc(r.text) + '</div><div class="sub gm-bidi">' + esc(r.crumb) + '</div></div>';

}

     that opened the switcher. The old setTimeout(...,10) left a ~10ms
     window where document.activeElement was still #mapwrap, so a keystroke
     typed right away (a fast typist, or a scripted test with no delay)
     was read by mapKeys()'s global shortcut handling instead of landing in

  var anchor = r.kind === 'node' ? N(r.id) : (linkRec ? N(linkRec.from) : null);
  if (!anchor) return;

     case it never has a DOM element at all — the old code's `var n =

  var expandedAny = false;

/* ── export / import ─────────────────────────────────────────────────────
   Contract: JSON as `<title>.glassmap.json`; Markdown outline for Obsidian
   ("- " nesting, relations under `## קשרים` as `[[from]] → [[to]]: label`);
   PNG export is explicitly out of scope. A plain Blob + <a download> is
   used rather than any host-specific download API, since this file must
   work standalone from disk as well as embedded. */

  return String(s || 'glassmap').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'glassmap';
}

  try {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var url = URL.createObjectURL(blob);

    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

  }

function doExportJSON() {
  var name = safeFileName(S.title) + '.glassmap.json';
  downloadText(name, JSON.stringify(S, null, 2), 'application/json');
  toast('נשמר ' + name + ' — Saved ' + name);
}
function buildMarkdownOutline() {
  var root = rootNode();
  var lines = ['# ' + (root.title || 'GlassMap')];
  if (root.body) lines.push('', root.body, '');
  (function walk(id, depth) {
    childrenOf(id).forEach(function (k) {
      var indent = '  '.repeat(depth);
      lines.push(indent + '- ' + (k.title || '') + (k.body ? ' — ' + k.body.replace(/\s+/g, ' ') : ''));
      if (k.bridge) lines.push(indent + '  ↳ 🪙 ' + k.bridge);   /* A5 */
      walk(k.id, depth + 1);

  })(root.id, 0);
  if (root.bridge) lines.splice(1, 0, '  ↳ 🪙 ' + root.bridge);

    lines.push('', '## קשרים');

      lines.push('[[' + (a ? a.title : '?') + ']] \u2192 [[' + (b ? b.title : '?') + ']]' + (l.label ? ': ' + l.label : ''));
    });
  }

}

/* Import: this file's own JSON, or a WaffleTask/WaffleNotes export

function importForeign(x) {
  if (!Array.isArray(x.projects) || !Array.isArray(x.tasks)) return null;
  var root = { id: uid('n'), parent: null, title: x.title || 'Imported board', body: '' };
  var nodes = [root];
  var pMap = {}, tMap = {};
  x.projects.forEach(function (p, i) {
    var nid = uid('n'); pMap[p.id] = nid;
    nodes.push({ id: nid, parent: root.id, title: p.name || 'Project', body: p.currentGoal || '', accent: ACCENTS[i % ACCENTS.length] });
  });
  x.tasks.forEach(function (t) { tMap[t.id] = uid('n'); });
  x.tasks.forEach(function (t) {
    var nid = tMap[t.id];
    var pid = (t.parent && tMap[t.parent]) ? tMap[t.parent] : (pMap[t.proj] || root.id);
    var parentNode = nodes.filter(function (n) { return n.id === pid; })[0];
    nodes.push({ id: nid, parent: pid, title: t.title || 'Task', body: t.notes || '', accent: parentNode ? (parentNode.accent || ACCENTS[0]) : ACCENTS[0] });
  });

    v: 1, id: S.id, title: x.title || 'Imported board', layer: 'links', theme: S.theme || 'auto',
    nodes: nodes, links: [], view: { x: 0, y: 0, z: 1, fit: false, touched: false },

function importText(txt, filename) {
  var parsed;
  try { parsed = JSON.parse(txt); } catch (e) {
    toast('הקובץ אינו JSON תקין — that file is not valid JSON');
    return;
  }

  if (own) { replaceState(own, 'הייבוא הושלם — board imported'); return; }
  var foreign = importForeign(parsed);
  if (foreign) {

       replaceState(), which never calls normalise() — so a task whose own
       `parent` pointed at itself (or any other malformed shape a foreign
       export could carry) produced a node that IS its own parent: never
       reachable from root, never rendered, never selectable/deletable
       through the UI, yet saved to localStorage forever. Route it through
       the same integrity checks the own-JSON import path already gets —

/* ── theme ───────────────────────────────────────────────────────────────
   `resolveTheme()` decides light/dark right now: a live push from the host
   (HOST_DARK, once one has arrived) always wins — "glassmap FOLLOWS the
   host" — otherwise the document's own S.theme, otherwise the OS. The
   standalone header's theme button only ever touches S.theme; it never
   exists in ?embed=1, where the host is assumed to be the only source of
   truth (contract: header — including theme — hidden in embed). */
function resolveTheme() {
  if (HOST_DARK !== null) return HOST_DARK;
  if (S.theme === 'light') return false;
  if (S.theme === 'dark') return true;
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', resolveTheme() ? 'dark' : 'light');
}
function cycleTheme() {
  S.theme = S.theme === 'auto' ? 'light' : (S.theme === 'light' ? 'dark' : 'auto');
  applyTheme(); persistSoft(); render();
  toast('ערכת נושא: ' + (S.theme === 'auto' ? 'אוטומטי' : S.theme === 'light' ? 'בהיר' : 'כהה'));
}

/* ── postMessage bridge (mirrors mindmap.html conventions) ──────────────── */
window.addEventListener('message', function (ev) {
  if (window.parent === window) return;                 /* nothing embedding this page */
  if (ev.origin !== location.origin && ev.origin !== 'null') return;   /* same-origin only; 'null' = file:// / sandboxed srcdoc */
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'ws-theme' && typeof d.dark === 'boolean') { HOST_DARK = d.dark; applyTheme(); render(); return; }
  if (d.type === 'gm:load' && d.data) {
    var next = normalise(JSON.parse(JSON.stringify(d.data)));
    if (next) replaceState(next, 'המפה נטענה — map loaded');
    return;
  }
});

    UI.find = ev.target.value;
    applyFindHaze();
  } else if (ev.target.id === 'switcherInput' && UI.switcher) {
    UI.switcher.q = ev.target.value;
    UI.switcher.idx = 0;
    renderSwitcher();
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.target.id === 'switcherInput') {
    if (!UI.switcher) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); UI.switcher.idx = Math.min(UI.switcher.results.length - 1, UI.switcher.idx + 1); renderSwitcher(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); UI.switcher.idx = Math.max(0, UI.switcher.idx - 1); renderSwitcher(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); switcherPick(UI.switcher.idx); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeSwitcher(); }
    return;
  }
  if (ev.target.id !== 'findInput') return;
  if (ev.key === 'Enter') { ev.preventDefault(); findJumpFirst(); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeFind(); el('#mapwrap').focus(); }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id !== 'importFile') return;
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  f.text().then(function (txt) { importText(txt, f.name); }).catch(function () {
    toast('לא ניתן לקרוא את הקובץ — could not read that file');
  });
  ev.target.value = '';
});

/* ── boot ────────────────────────────────────────────────────────────────
   `?embed=1` hides the header row (the host provides its own chrome);
   `?map=<id>` (default 'default') selects which stored map to open — a
   fresh id starts empty, per the contract's own verification plan. */
(function boot() {
  if (EMBED) el('#gmHead').hidden = true;
  el('#docTitle').textContent = S.title;
  /* `?theme=dark|light` is the initial hint a host gives before it can even
     postMessage yet (the iframe's own src is the only channel that early) —
     treat it exactly like an inbound `ws-theme` push so it wins the same
     way, until a real ws-theme message (or none ever arrives, e.g. opened
     standalone) takes over. */
  var qTheme = qparam('theme');
  if (qTheme === 'dark' || qTheme === 'light') HOST_DARK = (qTheme === 'dark');
  applyTheme();
  snapPrev = JSON.stringify(S);
  render();
  el('#mapwrap').focus();
})();
</script>
